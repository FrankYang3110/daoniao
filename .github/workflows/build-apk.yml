name: 构建 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Sync web assets
        run: |
          cp index.html android/app/src/main/assets/www/index.html
          cp manifest.webmanifest android/app/src/main/assets/www/manifest.webmanifest
          cp icon-180.png icon-192.png icon-512.png android/app/src/main/assets/www/
          echo "synced:"; ls -la android/app/src/main/assets/www/
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: daoniao-debug-keystore-v1

      - name: Stamp version
        working-directory: android
        run: |
          N=${{ github.run_number }}
          sed -i -E "s/versionCode [0-9]+/versionCode $N/; s/versionName \"[^\"]+\"/versionName \"1.0.$N\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename artifact
        run: |
          mkdir -p out
          VER="v1.0.${{ github.run_number }}"
          SRC=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "source apk: $SRC"
          cp "$SRC" "out/daoniao-${VER}.apk"
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daoniao-apk
          path: out/*.apk
          retention-days: 90

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 导尿记录 v1.0.${{ github.run_number }}
          body: |
            安卓离线版「导尿记录」v1.0.${{ github.run_number }}。

            本次更新
            - 记录按月、按天两级折叠，默认只展开当月和今天
            - 不再只显示最近 800 条，全部历史都能看到（按月分页加载）
            - 新增「复诊简报」：近 7 天 / 30 天 / 全部，一键复制成文字发给医生
            - 新增「设置」：女儿生日、夜间时段、超量红线、默认量都能改
            - 隔夜那一泡不再误报「间隔过长」
            - 长按水分按钮可记「喝汤 / 喝粥」
            - 导出 CSV 增加间隔、期间饮水、当日累计三列
            - 每次导出自动留一份备份在 App 内，每天自动备份一次
            - 记号/删除都可以撤销，误点不怕

            下载下方 `daoniao-*.apk` 安装即可。
          files: out/*.apk
          draft: false
          prerelease: false
