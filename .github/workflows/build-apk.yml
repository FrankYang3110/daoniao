name: 构建 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Sync web assets
        run: |
          cp index.html android/app/src/main/assets/www/index.html
          cp manifest.webmanifest android/app/src/main/assets/www/manifest.webmanifest
          echo "synced:"; ls -la android/app/src/main/assets/www/
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename artifact
        run: |
          mkdir -p out
          VER="v1.0.${{ github.run_number }}"
          SRC=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "source apk: $SRC"
          cp "$SRC" "out/daoniao-${VER}.apk"
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daoniao-apk
          path: out/*.apk
          retention-days: 90

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 导尿记录 v1.0.${{ github.run_number }}
          body: |
            安卓离线版「导尿记录」。

            - 单次导尿超 180 ml 标红提醒
            - 白天间隔超 3 小时提醒，夜间（22:00-06:00）不打扰
            - 记录导尿时间、尿量、饮水量，按天汇总出入量
            - 一键导出 CSV 到「下载/导尿记录」文件夹
            - 完全离线，无网络权限，数据只存本机

            下载下方 `daoniao-*.apk` 安装即可。
          files: out/*.apk
          draft: false
          prerelease: false
