name: 构建 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 构建 APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 列出产物
        run: ls -la android/app/build/outputs/apk/debug/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: daoniao-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: 重命名并发布 Release
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk out/导尿记录-v${{ github.run_number }}.apk
          ls -la out/

      - name: 创建 Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 导尿记录 v1.0.${{ github.run_number }}
          body: |
            安卓离线版「导尿记录」：间歇导尿与饮水记录，单次超 180ml 提醒、白天 3 小时间隔提醒，数据仅存本机，可导出 CSV。

            下载下面 Assets 里的 `.apk` 安装即可。
          files: out/*.apk
          draft: false
          prerelease: false
