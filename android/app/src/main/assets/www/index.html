<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="导尿记录">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>导尿记录</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  background:#eef1f5;color:#0f172a;font-size:16px;-webkit-text-size-adjust:100%;
  padding:12px 12px calc(28px + env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;
  user-select:none;overflow-x:hidden;
}
.card{background:#fff;border-radius:18px;padding:16px 16px 14px;box-shadow:0 1px 3px rgba(15,23,42,.07);margin-bottom:12px}

/* ---------- 状态卡 ---------- */
.stat-label{font-size:13px;color:#64748b;font-weight:600;letter-spacing:.3px}
.stat-main{display:flex;align-items:center;gap:10px;margin-top:2px;flex-wrap:wrap}
.big{font-size:clamp(32px,10.5vw,44px);font-weight:800;line-height:1.15;letter-spacing:-1px;font-variant-numeric:tabular-nums;color:#0f172a}
.big.none{color:#94a3b8}
.big.warn{color:#b45309}
.big.late{color:#b91c1c}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;background:#eef2f7;color:#475569;white-space:nowrap}
.badge.ok{background:#dcfce7;color:#15803d}
.badge.warn{background:#fef3c7;color:#b45309}
.badge.late{background:#fee2e2;color:#b91c1c;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
.stat-sub{font-size:13.5px;color:#64748b;margin-top:6px;font-variant-numeric:tabular-nums}
.stat-div{height:1px;background:#f1f5f9;margin:12px 0 10px}
.today{font-size:14px;color:#334155;line-height:1.75;font-variant-numeric:tabular-nums}
.today b{font-weight:800;font-size:15.5px;color:#0f172a}
.today .seg{white-space:nowrap}
.tsum{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px;font-size:14px;color:#334155;
  font-variant-numeric:tabular-nums}
.tsum .it{white-space:nowrap}
.tsum .it b{font-size:15.5px;font-weight:800;color:#0f172a;margin:0 1px}
.over{color:#dc2626;font-weight:700}

/* ---------- 主按钮 ---------- */
.main-row{display:grid;grid-template-columns:2.15fr 1fr;gap:8px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-radius:16px;
  padding:14px 8px;font-size:19px;font-weight:800;
  color:#fff;background:#2563eb;box-shadow:0 4px 14px rgba(37,99,235,.28);
  font-family:inherit;letter-spacing:.5px}
.btn:active{transform:translateY(1px);box-shadow:0 2px 8px rgba(37,99,235,.25)}
.btn-poo{background:#f1f5f9;color:#7c4a1e;box-shadow:none;font-size:15px;font-weight:800;
  flex-direction:column;gap:1px;line-height:1.15;letter-spacing:0;padding:10px 4px}
.btn-poo:active{background:#e2e8f0;transform:translateY(1px);box-shadow:none}
.btn-poo .em{font-size:16px;line-height:1}

/* ---------- 喝水行 ---------- */
.water-row{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:5px;align-items:center;margin-bottom:14px}
.water-label{font-size:15px;font-weight:700;color:#0e7490;white-space:nowrap;padding-right:1px}
.chipbtn{border:0;border-radius:12px;padding:14px 0;font-size:14.5px;font-weight:700;min-width:0;overflow:hidden;
  background:#e0f2fe;color:#075985;font-family:inherit;font-variant-numeric:tabular-nums}
.chipbtn:active{background:#bae6fd}
.chipbtn.alt{background:#f1f5f9;color:#475569}
.chipbtn.alt:active{background:#e2e8f0}

/* ---------- 列表 ---------- */
.list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.list-head .t{font-size:16px;font-weight:800}
.link{border:0;background:transparent;color:#2563eb;font-size:14px;font-weight:700;padding:6px 4px;font-family:inherit}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
  padding:14px 0 5px;font-size:12.5px;color:#64748b;font-weight:700;border-top:1px solid #f1f5f9}
.dh:first-child{border-top:0;padding-top:8px}
.dh .sum{font-weight:600;color:#94a3b8;font-variant-numeric:tabular-nums;text-align:right;margin-left:auto}
.rec{display:flex;align-items:center;gap:9px;padding:11px 0;border-top:1px solid #f8fafc}
.rec .rt{width:52px;flex:none;font-size:15px;color:#64748b;font-variant-numeric:tabular-nums}
.rec .tag{flex:none;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.tag.c{background:#e0e7ff;color:#3730a3}
.tag.w{background:#cffafe;color:#0e7490}
.rec .rv{margin-left:auto;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.rv .u{font-size:11px;font-weight:700;color:#94a3b8;margin-left:2px}
.rec .x{border:0;background:transparent;color:#cbd5e1;font-size:22px;line-height:1;padding:2px 8px;font-family:inherit}
.rec .x:active{color:#ef4444}
.warnmark{color:#dc2626;font-size:11.5px;font-weight:800;margin-left:6px;vertical-align:1px}
.empty{color:#94a3b8;font-size:14px;text-align:center;padding:22px 0}
.foot{display:flex;justify-content:center;gap:18px;padding:6px 0 2px}
.foot button{border:0;background:transparent;color:#94a3b8;font-size:12.5px;padding:8px;font-family:inherit}

/* ---------- 双列：左导尿 / 右水分 ---------- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col{min-width:0}
.col-head{display:flex;align-items:baseline;justify-content:space-between;gap:4px;
  padding:7px 8px;border-radius:9px;margin-bottom:4px;font-size:13px;font-weight:800;white-space:nowrap}
.col-head .n{font-variant-numeric:tabular-nums;font-weight:700;font-size:12px;opacity:.75;white-space:nowrap}
.col-c .col-head{background:#e0e7ff;color:#3730a3}
.col-w .col-head{background:#cffafe;color:#0e7490}
.rec2{display:flex;align-items:center;gap:5px;padding:9px 8px;border-radius:8px;
  border-top:1px solid #f8fafc;min-width:0}
.rec2 .rt{flex:none;font-size:13.5px;color:#64748b;font-variant-numeric:tabular-nums}
.rec2 .rv{margin-left:auto;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rec2 .u{font-size:10.5px;font-weight:700;color:#94a3b8;margin-left:1px}
.rec2 .warnmark{display:inline-block;font-size:10px;font-weight:800;color:#dc2626;
  background:#fee2e2;border-radius:4px;padding:1px 3px;margin-left:3px;vertical-align:1.5px}
.rec2 .x{border:0;background:transparent;color:#d7dee8;font-size:19px;line-height:1;padding:1px 3px;font-family:inherit;flex:none}
.rec2 .x:active{color:#ef4444}
.rec2.over{background:#fef2f2}
.rec2.over .rv{color:#dc2626}
.rec2.poo{background:#fdf6ec;border-radius:8px}
.rec2 .poov{font-size:14px;font-weight:800;color:#92400e;white-space:nowrap}
.warnmark{display:block;font-size:10.5px;font-weight:800;color:#dc2626;margin-top:1px;line-height:1.1}
.col-empty{color:#cbd5e1;font-size:12.5px;text-align:center;padding:16px 0}
.dh .sum.c{color:#4338ca}
.dh .sum.w{color:#0e7490}

/* 间隔标记：距上次导尿 */
.rec2 .gap{display:block;font-size:10.5px;font-weight:700;color:#94a3b8;
  font-variant-numeric:tabular-nums;line-height:1.25;margin-top:1px}
.rec2 .gap.long{color:#f59e0b}

/* 水分类型小标签 */
.rec2 .jt{display:inline-block;font-size:10px;font-weight:800;padding:1px 4px;border-radius:4px;
  margin-right:3px;vertical-align:1.5px;background:#e0f2fe;color:#0369a1}
.rec2 .jt.s{background:#fef3c7;color:#b45309}
.rec2 .jt.p{background:#dcfce7;color:#15803d}

/* ---------- 底部弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.32);opacity:0;pointer-events:none;transition:opacity .18s;z-index:20}
.mask.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;transform:translateY(102%);transition:transform .2s ease;
  padding:0 8px calc(8px + env(safe-area-inset-bottom));pointer-events:none}
.sheet.open{transform:translateY(0);pointer-events:auto}
.sheet-box{background:#fff;border-radius:22px;padding:18px 16px calc(16px + env(safe-area-inset-bottom));
  max-width:504px;margin:0 auto;box-shadow:0 -6px 30px rgba(15,23,42,.16)}
.sheet-title{font-size:18px;font-weight:800;text-align:center}
.sheet-hint{font-size:13px;color:#64748b;text-align:center;margin-top:5px;min-height:18px;font-variant-numeric:tabular-nums}
.amt{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:14px 0 12px}
.amt input{width:62%;border:0;border-bottom:2.5px solid #e2e8f0;background:transparent;text-align:center;
  font-size:40px;font-weight:800;color:#0f172a;font-family:inherit;padding:4px 0;outline:none;
  font-variant-numeric:tabular-nums;border-radius:0;
  -webkit-appearance:none;appearance:textfield;-moz-appearance:textfield}
.amt input::-webkit-outer-spin-button,
.amt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.amt input:focus{border-bottom-color:#2563eb}
.amt .unit{font-size:17px;font-weight:700;color:#94a3b8}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:12px}
.chips .chipbtn{font-size:16px}
.timerow{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;
  color:#64748b;font-weight:600;margin-bottom:14px}
.timerow input{border:1px solid #e2e8f0;border-radius:10px;padding:9px 12px;font-size:16px;
  font-family:inherit;color:#0f172a;background:#f8fafc;font-variant-numeric:tabular-nums}
.sheet-actions{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.sheet-actions button{border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:800;font-family:inherit}
.btn-ghost{background:#f1f5f9;color:#475569}
.btn-main{background:#2563eb;color:#fff}
.btn-main:active{background:#1d4ed8}

/* ---------- 滚轮选择器 ---------- */
.picker{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 14px;position:relative}
.picker .col{min-width:0;flex:none}
.pwrap{height:132px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;width:92px;position:relative;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent);
  mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent)}
.pwrap::-webkit-scrollbar{display:none}
.pitem{height:44px;line-height:44px;text-align:center;font-size:19px;font-weight:700;
  color:#cbd5e1;scroll-snap-align:center;font-variant-numeric:tabular-nums}
.pitem.sel{color:#0f172a;font-size:23px;font-weight:800}
.pitem.sel.over{color:#dc2626}
.pind{position:absolute;left:0;right:0;top:50%;height:44px;margin-top:-22px;pointer-events:none;
  border-top:1.5px solid #e2e8f0;border-bottom:1.5px solid #e2e8f0;background:rgba(37,99,235,.04);border-radius:10px}
.punit{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:700;color:#94a3b8}

/* ---------- 水分类型选择 ---------- */
.jrow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.jrow .chipbtn{padding:12px 0;font-size:15px}
.jrow .chipbtn.on{background:#0e7490;color:#fff;box-shadow:0 2px 8px rgba(14,116,144,.3)}

/* ---------- 提示条 ---------- */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,16px);
  background:#0f172a;color:#fff;font-size:14.5px;font-weight:600;padding:12px 18px;border-radius:12px;
  opacity:0;pointer-events:none;transition:all .22s;z-index:40;max-width:88vw;text-align:center;line-height:1.4}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:#b91c1c}

/* ---------- v1.1：撤销 / 夜间 / 编辑 ---------- */
.toast.show.hasundo{pointer-events:auto}
.toast .undo{border:0;background:#fff;color:#0f172a;font-weight:800;font-size:14px;
  padding:6px 12px;border-radius:9px;font-family:inherit;white-space:nowrap}
.toast .undo:active{background:#e2e8f0}
.toast.bad .undo{color:#b91c1c}
.nightmark{display:inline-block;font-size:10px;font-weight:800;color:#475569;background:#e2e8f0;
  border-radius:4px;padding:1px 4px;margin-right:3px;vertical-align:1.5px}
.moremark{display:inline-block;font-size:10px;font-weight:800;color:#64748b;background:#f1f5f9;
  border-radius:4px;padding:1px 4px;margin-left:4px;vertical-align:1.5px}
.rec2{cursor:pointer}
.timerow input[type=date]{min-width:132px;padding:9px 8px}
.sheet-actions.edit{grid-template-columns:1fr 1fr 1.25fr}
.btn-danger{background:#fee2e2;color:#b91c1c}
</style>
</head>
<body>

<div class="card">
  <div class="stat-label">距上次导尿</div>
  <div class="stat-main">
    <div class="big" id="elapsed">—</div>
    <div class="badge" id="badge">无记录</div>
  </div>
  <div class="stat-sub" id="lastInfo">还没有导尿记录</div>
  <div class="stat-div"></div>
  <div class="today" id="todayLine">今日还没有记录</div>
</div>

<div class="main-row">
  <button class="btn" id="btnCath">＋ 记一次导尿</button>
  <button class="btn btn-poo" id="btnPoo"><span class="em">💩</span>记排便</button>
</div>

<div class="water-row">
  <span class="water-label">💧 水分</span>
  <button class="chipbtn" data-w="50">+50</button>
  <button class="chipbtn" data-w="100">+100</button>
  <button class="chipbtn" data-w="150">+150</button>
  <button class="chipbtn" data-w="200">+200</button>
  <button class="chipbtn alt" data-w="0">其他</button>
</div>

<div class="card">
  <div class="list-head"><span class="t">记录</span><button class="link" id="btnCsv">导出 CSV</button></div>
  <div id="list"></div>
</div>

<div class="foot">
  <button id="btnBackup">备份数据</button>
  <button id="btnRestore">恢复备份</button>
  <button id="btnClear">清空全部数据</button>
</div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="sheet-box">
    <div class="sheet-title" id="sheetTitle">记录</div>
    <div class="sheet-hint" id="sheetHint"></div>
    <div class="jrow" id="jrow" style="display:none">
      <button class="chipbtn on" type="button" data-j="w">喝水</button>
      <button class="chipbtn" type="button" data-j="s">喝汤</button>
      <button class="chipbtn" type="button" data-j="p">喝粥</button>
    </div>
    <div class="picker" id="pickerBox">
      <div class="col">
        <div class="pwrap" id="pwrap"></div>
      </div>
      <div class="pind"></div>
      <span class="punit">ml</span>
    </div>
    <div class="chips" id="chips"></div>
    <label class="timerow"><input id="dt" type="date"> <input id="tm" type="time"></label>
    <div class="sheet-actions" id="sheetActions">
      <button class="btn-ghost btn-danger" id="sheetDel" style="display:none">删除</button>
      <button class="btn-ghost" id="sheetCancel">取消</button>
      <button class="btn-main" id="sheetOk">保　存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button class="undo" id="toastUndo" type="button">撤销</button></div>

<script>
(function(){
'use strict';

/* ====== 参数：要改只改这里 ====== */
var CFG = {
  MAX_ML   : 400,   // 单次导尿「红色」安全线：400ml 及以上算过多
  MORE_X   : 1.5,   // 超过个人中位数的倍数 → 灰字「较多」（不标红）
  BASE_DAYS: 14,    // 个人基线统计窗口（天）
  BASE_MIN : 5,     // 至少有 5 个间隔样本才启用个人基线
  GAP_WARN : 1.3,   // 超过个人中位间隔 1.3 倍 → 偏久
  GAP_LATE : 1.6,   // 超过 1.6 倍 → 已超时
  DAY_H    : 3,     // 样本不足时退回的默认间隔（小时）
  NIGHT_H  : 8,     // 夜间阈值（只显示，不报警）
  NIGHT_S  : 22,    // 夜间开始 22:00
  NIGHT_E  : 6,     // 夜间结束 06:00
  DEF_CATH : 150,   // 导尿默认量
  DEF_WATER: 150,   // 水分默认量
  STEP_CATH : 1,    // 导尿滚轮精度 1ml
  STEP_WATER: 5,    // 水分滚轮精度 5ml
  MIN_CATH : 10,    // 导尿最小 10ml
  MAX_CATH : 800,   // 导尿可录入的最大值（能记进去，才可能被如实记下来）
  MIN_WATER: 5,
  MAX_WATER: 1000,
  KEY      : 'cathlog_v1'
};

/* 水分类型 */
var JLIST = { w:'喝水', s:'喝汤', p:'喝粥' };
var JCLS  = { w:'', s:'s', p:'p' };

/* ====== 存储（无 localStorage 时降级为内存） ====== */
var data = [];
function load(){
  try{ var s = localStorage.getItem(CFG.KEY); if(s){ var a = JSON.parse(s); if(Array.isArray(a)) return a; } }catch(e){}
  return [];
}
function save(){
  try{ localStorage.setItem(CFG.KEY, JSON.stringify(data)); }catch(e){}
}
data = load();
data.sort(function(a,b){ return a.t - b.t; });

/* ====== 工具 ====== */
function p2(n){ return n<10 ? '0'+n : ''+n; }
function dayKey(ts){ var d=new Date(ts); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function hm(ts){ var d=new Date(ts); return p2(d.getHours())+':'+p2(d.getMinutes()); }
function isNight(ts){ var h=new Date(ts).getHours(); return (h>=CFG.NIGHT_S || h<CFG.NIGHT_E); }
function dayLabel(ts){
  var d=new Date(ts), now=new Date(), w=['周日','周一','周二','周三','周四','周五','周六'];
  var s = (d.getMonth()+1)+'月'+d.getDate()+'日 '+w[d.getDay()];
  if(dayKey(ts)===dayKey(now.getTime())) s = '今天 · '+s;
  else{
    var y=new Date(now.getTime()-86400000);
    if(dayKey(ts)===dayKey(y.getTime())) s = '昨天 · '+s;
  }
  return s;
}
function fmtDur(ms){
  var m = Math.floor(ms/60000);
  if(m < 1) return '刚刚';
  var h = Math.floor(m/60), mm = m%60;
  if(h === 0) return mm+'分';
  return h+'小时'+mm+'分';
}

/* 紧凑间隔：3h28min */
function fmtGap(ms){
  var m = Math.floor(ms/60000);
  if(m < 1) return '0min';
  var h = Math.floor(m/60), mm = m%60;
  if(h === 0) return mm+'min';
  if(mm === 0) return h+'h';
  return h+'h'+p2(mm)+'min';
}

/* ====== 个人基线：最近 14 天的中位数 ====== */
var CUR = { n:0, gapMs:CFG.DAY_H*3600000, gapOK:false, volMed:0, volOK:false };

function median(arr){
  if(!arr || !arr.length) return 0;
  var a = arr.slice().sort(function(x,y){ return x - y; });
  var m = Math.floor(a.length/2);
  return (a.length % 2) ? a[m] : (a[m-1] + a[m]) / 2;
}

/* 用最近 BASE_DAYS 天的记录，算出「平时多久一次」「平时一次多少」。
   基线是描述性的，不是医嘱：它只用来判断“跟平常比怎么样”。 */
function computeBaseline(){
  var cut = Date.now() - CFG.BASE_DAYS*86400000;
  var cs = [], i;
  for(i=0;i<data.length;i++){ var e=data[i]; if(e.k==='c' && e.t>=cut) cs.push(e); }

  var gaps = [], vols = [];
  for(i=1;i<cs.length;i++){
    var g = cs[i].t - cs[i-1].t;
    if(g > 10*60000 && g <= 12*3600000) gaps.push(g);   /* 排除误触和跨夜中断 */
  }
  for(i=0;i<cs.length;i++){ if(cs[i].v > 0) vols.push(cs[i].v); }

  CUR.n      = cs.length;
  CUR.gapOK  = gaps.length >= CFG.BASE_MIN;
  CUR.gapMs  = CUR.gapOK ? median(gaps) : CFG.DAY_H*3600000;
  CUR.volOK  = vols.length >= CFG.BASE_MIN;
  CUR.volMed = CUR.volOK ? median(vols) : 0;
  return CUR;
}

/* 水分类型（兼容旧记录：无 j 字段视为喝水） */
function jOf(e){
  if(e.k !== 'w') return '';
  return (e.j === 's' || e.j === 'p') ? e.j : 'w';
}

/* 是否排便记录（k='p'，只记时间） */
function isPoo(e){ return e.k === 'p'; }

/* ====== 提示条（可带「撤销」） ====== */
var toastTimer = null, undoFn = null;

/* 轻震一下：APK 里有 VIBRATE 权限时生效，浏览器里多数无效，失败就静默 */
function buzz(){
  try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}
}

function hideToast(){
  document.getElementById('toast').className = 'toast';
  undoFn = null;
}
function toast(msg, bad, onUndo){
  var el = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  undoFn = onUndo || null;
  document.getElementById('toastUndo').style.display = undoFn ? 'inline-block' : 'none';
  el.className = 'toast show' + (bad ? ' bad' : '') + (undoFn ? ' hasundo' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, undoFn ? 5200 : 2600);
}
function runUndo(){
  var fn = undoFn;
  hideToast();
  if(fn){ try{ fn(); }catch(e){} }
}

/* ====== 状态区 ====== */
function lastCath(){
  for(var i=data.length-1;i>=0;i--){ if(data[i].k==='c') return data[i]; }
  return null;
}

/* 上一次水分摄入（喝水/喝汤/喝粥 均算） */
function lastWater(){
  for(var i=data.length-1;i>=0;i--){ if(data[i].k==='w') return data[i]; }
  return null;
}

function renderStatus(){
  var now = Date.now();
  var lc = lastCath();
  var elE = document.getElementById('elapsed');
  var elB = document.getElementById('badge');
  var elL = document.getElementById('lastInfo');

  var b = computeBaseline();

  if(!lc){
    elE.textContent = '—';
    elE.className = 'big none';
    elB.className = 'badge';
    elB.textContent = '无记录';
    elL.textContent = '还没有导尿记录，点下面的蓝色按钮开始';
  }else{
    var ms = now - lc.t;
    elE.textContent = fmtDur(ms);

    var cls, txt;
    if(isNight(now)){
      cls=''; txt='夜间';
    }else if(b.gapOK){
      var r = ms / b.gapMs;
      if(r < CFG.GAP_WARN){ cls='ok'; txt='正常'; }
      else if(r < CFG.GAP_LATE){ cls='warn'; txt='偏久'; }
      else { cls='late'; txt='已超时'; }
    }else{
      var h = ms/3600000;
      if(h < CFG.DAY_H){ cls='ok'; txt='正常'; }
      else if(h < CFG.DAY_H+0.5){ cls='warn'; txt='偏久'; }
      else { cls='late'; txt='已超时'; }
    }
    elE.className = 'big' + (cls ? ' '+cls : '');
    elB.className = 'badge' + (cls ? ' '+cls : '');
    elB.textContent = txt;

    var isToday = dayKey(lc.t) === dayKey(now);
    var when = isToday ? hm(lc.t) : dayLabel(lc.t).replace(' · ',' ') + ' ' + hm(lc.t);
    var info = '上次 ' + when + ' · ' + lc.v + ' ml';
    if(!isNight(now)){
      info += ' · 平时 ' + fmtGap(b.gapMs) + ' · 预计 ' + hm(lc.t + b.gapMs);
    }
    elL.textContent = info;
  }

  /* 今日汇总（次要信息压成一行，明细在列表里看） */
  var tk = dayKey(now), cN=0, cSum=0, wSum=0, over=0, pN=0, nightN=0;
  for(var i=0;i<data.length;i++){
    var e = data[i];
    if(dayKey(e.t) !== tk) continue;
    if(e.k === 'c'){ cN++; cSum += e.v; if(e.v >= CFG.MAX_ML) over++; if(isNight(e.t)) nightN++; }
    else if(e.k === 'p'){ pN++; }
    else { wSum += e.v; }
  }
  var line;
  if(cN === 0 && wSum === 0 && pN === 0){ line = '<span style="color:#94a3b8">今日还没有记录</span>'; }
  else{
    line = '<div class="tsum">'+
      '<span class="it">导尿 <b>'+cN+'</b> 次 · <b>'+cSum+'</b> ml'+(nightN ? '（夜'+nightN+'）' : '')+'</span>'+
      '<span class="it">水分 <b>'+wSum+'</b> ml</span>'+
      (pN > 0 ? '<span class="it">排便 <b>'+pN+'</b> 次</span>' : '')+
    '</div>';
    if(over > 0) line += '<br><span class="over">⚠ 有 '+over+' 次达到 '+CFG.MAX_ML+' ml 以上</span>';
  }
  document.getElementById('todayLine').innerHTML = line;
}

/* ====== 记录列表：左导尿 / 右水分（每日升序） ====== */
function renderList(){
  var box = document.getElementById('list');
  if(data.length === 0){
    box.innerHTML = '<div class="empty">还没有记录</div>';
    return;
  }

  /* 已按时间升序；从新到旧分组，组内保持升序 */
  var slice = data.slice(-600);
  var groups = [], cur = null;
  for(var i=0;i<slice.length;i++){
    var e = slice[i];
    var k = dayKey(e.t);
    if(!cur || cur.k !== k){ cur = {k:k, items:[]}; groups.unshift(cur); }
    cur.items.push(e);
  }

  /* 预计算间隔：导尿↔上次导尿；水分↔上次水分（喝水/汤/粥均算） */
  var gapMap = {};
  var prevCath = null, prevWater = null;
  for(var p=0;p<slice.length;p++){
    var en = slice[p];
    if(en.k === 'c'){
      if(prevCath) gapMap[en.id] = en.t - prevCath.t;
      prevCath = en;
    }else if(en.k === 'w'){
      if(prevWater) gapMap[en.id] = en.t - prevWater.t;
      prevWater = en;
    }
  }

  var html = '';
  groups.forEach(function(g){
    var caths = [], waters = [], poos = [];
    var cSum=0, wSum=0;
    var jSum = { w:0, s:0, p:0 };
    g.items.forEach(function(e){
      if(e.k==='c'){ caths.push(e); cSum += e.v; }
      else if(e.k==='p'){ poos.push(e); }
      else { waters.push(e); wSum += e.v; jSum[jOf(e)] += e.v; }
    });

    /* 左列：导尿 + 排便，按时间合并升序 */
    var left = caths.concat(poos).sort(function(a,b){ return a.t - b.t; });

    var jtxt = [];
    if(jSum.w) jtxt.push('水'+jSum.w);
    if(jSum.s) jtxt.push('汤'+jSum.s);
    if(jSum.p) jtxt.push('粥'+jSum.p);

    var dhRight = '导尿 '+caths.length+'次 '+cSum+'ml · 水分 '+wSum+'ml';
    if(poos.length) dhRight += ' · 便'+poos.length;

    html += '<div class="dh"><span>'+dayLabel(g.items[0].t)+'</span>'+
            '<span class="sum">'+dhRight+'</span></div>';

    html += '<div class="cols">';
    html += '<div class="col col-c">'+
              '<div class="col-head"><span>导尿 / 排便</span>'+
              '<span class="n">'+caths.length+'次 '+cSum+'ml</span></div>'+
              (left.length ? left.map(function(e){
                 return e.k==='p' ? rowPoo(e) : rowCath(e, gapMap[e.id]);
              }).join('') : '<div class="col-empty">无</div>')+
            '</div>';
    html += '<div class="col col-w">'+
              '<div class="col-head"><span>水分</span><span class="n">'+(jtxt.length ? jtxt.join('·') : '0')+'</span></div>'+
              (waters.length ? waters.map(function(e){ return rowWater(e, gapMap[e.id]); }).join('') : '<div class="col-empty">无</div>')+
            '</div>';
    html += '</div>';
  });
  box.innerHTML = html;
}

function rowCath(e, gapMs){
  var over = e.v >= CFG.MAX_ML;
  var more = !over && CUR.volMed > 0 && e.v > CUR.volMed*CFG.MORE_X;
  var gap = '';
  if(gapMs != null){
    var longCls = gapMs > CUR.gapMs*CFG.GAP_LATE ? ' long' : '';
    gap = '<span class="gap'+longCls+'">+' + fmtGap(gapMs) + '</span>';
  }
  var night = isNight(e.t) ? '<span class="nightmark">夜</span>' : '';
  return '<div class="rec2'+(over?' over':'')+'" data-edit="'+e.id+'">'+
      '<span class="rt">'+night+hm(e.t)+gap+'</span>'+
      '<span class="rv">'+e.v+'<span class="u">ml</span>'+
        (over ? '<span class="warnmark">偏多</span>'
              : (more ? '<span class="moremark">较多</span>' : ''))+
      '</span>'+
      '<button class="x" data-del="'+e.id+'">×</button>'+
    '</div>';
}

function rowWater(e, gapMs){
  var j = jOf(e);
  var tag = j === 'w' ? '' : '<span class="jt '+JCLS[j]+'">'+JLIST[j]+'</span>';
  var gap = '';
  if(gapMs != null){
    gap = '<span class="gap">+' + fmtGap(gapMs) + '</span>';
  }
  var night = isNight(e.t) ? '<span class="nightmark">夜</span>' : '';
  return '<div class="rec2" data-edit="'+e.id+'">'+
      '<span class="rt">'+night+hm(e.t)+gap+'</span>'+
      '<span class="rv">'+tag+e.v+'<span class="u">ml</span></span>'+
      '<button class="x" data-del="'+e.id+'">×</button>'+
    '</div>';
}

/* 排便：只记时间，右侧显示“排便” */
function rowPoo(e){
  var night = isNight(e.t) ? '<span class="nightmark">夜</span>' : '';
  return '<div class="rec2 poo" data-edit="'+e.id+'">'+
      '<span class="rt">'+night+hm(e.t)+'</span>'+
      '<span class="rv poov">排便</span>'+
      '<button class="x" data-del="'+e.id+'">×</button>'+
    '</div>';
}

function renderAll(){ renderStatus(); renderList(); }

/* ====== 新增 / 删除 / 撤销 ====== */
function addEntry(kind, ml, ts, j){
  var o = {
    id: String(ts) + Math.random().toString(36).slice(2,7),
    t: ts,
    k: kind,
    v: ml
  };
  if(kind === 'w' && j && j !== 'w') o.j = j;
  data.push(o);
  data.sort(function(a,b){ return a.t - b.t; });
  save();
  renderAll();
  buzz();
  return o;
}

function findEntry(id){
  for(var i=0;i<data.length;i++){ if(data[i].id === id) return data[i]; }
  return null;
}

/* 删除后 5 秒内可撤销，代替确认弹窗 */
function delEntry(id){
  var e = findEntry(id);
  if(!e) return;
  data = data.filter(function(x){ return x.id !== id; });
  save();
  renderAll();
  toast('已删除 ' + hm(e.t) + ' 这条记录', false, function(){
    data.push(e);
    data.sort(function(a,b){ return a.t - b.t; });
    save();
    renderAll();
    toast('已恢复');
  });
}

/* ====== 滚轮选择器 ====== */
var picker = { wrap:null, values:[], idx:0, timer:null };

function buildPicker(isCath, initVal){
  var wrap = document.getElementById('pwrap');
  wrap.innerHTML = '';
  var step = isCath ? CFG.STEP_CATH : CFG.STEP_WATER;
  var min  = isCath ? CFG.MIN_CATH  : CFG.MIN_WATER;
  var max  = isCath ? CFG.MAX_CATH  : CFG.MAX_WATER;

  var vals = [];
  for(var v=min; v<=max; v+=step){ vals.push(v); }
  picker.values = vals;
  picker.wrap = wrap;
  picker.step = step;

  vals.forEach(function(v){
    var d = document.createElement('div');
    d.className = 'pitem';
    d.textContent = v;
    d.dataset.v = v;
    wrap.appendChild(d);
  });

  /* 上下各垫一个空行，使首尾能对齐中线 */
  var pad1 = document.createElement('div'); pad1.className = 'pitem'; pad1.style.height='44px'; pad1.style.visibility='hidden';
  var pad2 = document.createElement('div'); pad2.className = 'pitem'; pad2.style.height='44px'; pad2.style.visibility='hidden';
  wrap.insertBefore(pad1, wrap.firstChild);
  wrap.appendChild(pad2);

  var i = vals.indexOf(initVal);
  if(i < 0) i = Math.min(vals.length-1, Math.max(0, Math.round((initVal-min)/step)));
  picker.idx = i;

  wrap.onscroll = function(){
    clearTimeout(picker.timer);
    picker.timer = setTimeout(function(){ snapPicker(); }, 90);
  };

  /* 点击某行直接选中 */
  wrap.onclick = function(ev){
    var t = ev.target;
    if(!t || !t.dataset || !t.dataset.v) return;
    var k = vals.indexOf(parseInt(t.dataset.v,10));
    if(k >= 0) scrollToIdx(k, true);
  };
}

function scrollToIdx(i, smooth){
  var wrap = picker.wrap;
  if(!wrap) return;
  picker.idx = i;
  wrap.scrollTo({ top: i*44, behavior: smooth ? 'smooth' : 'auto' });
  setTimeout(markPicker, smooth ? 220 : 0);
}

function snapPicker(){
  var wrap = picker.wrap;
  if(!wrap) return;
  var i = Math.round(wrap.scrollTop / 44);
  i = Math.max(0, Math.min(picker.values.length-1, i));
  picker.idx = i;
  if(Math.abs(wrap.scrollTop - i*44) > 1){
    wrap.scrollTo({ top: i*44, behavior:'smooth' });
  }
  markPicker();
}

function markPicker(){
  var wrap = picker.wrap;
  if(!wrap) return;
  var items = wrap.querySelectorAll('.pitem[data-v]');
  for(var i=0;i<items.length;i++){
    var on = i === picker.idx;
    items[i].className = 'pitem' + (on ? ' sel' : '') + (on && picker.values[i] > CFG.MAX_ML && sheetKind==='c' ? ' over' : '');
  }
}

function pickerValue(){
  return picker.values[picker.idx] || CFG.DEF_CATH;
}

/* ====== 底部弹层（新增 / 编辑共用） ====== */
var sheetKind = null;
var sheetJ = 'w';
var editId = null;

function nowTimeValue(){
  var d = new Date();
  return p2(d.getHours())+':'+p2(d.getMinutes());
}
function dateValue(ts){
  var d = new Date(ts);
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
}

/* 读日期 + 时间。null = 没填好，-1 = 晚于现在 */
function readWhen(){
  var dv = document.getElementById('dt').value || '';
  var tv = document.getElementById('tm').value || '';
  var p = dv.split('-'), q = tv.split(':');
  if(p.length !== 3 || q.length !== 2) return null;
  var d = new Date(+p[0], +p[1]-1, +p[2], +q[0], +q[1], 0, 0);
  var t = d.getTime();
  if(isNaN(t)) return null;
  if(t > Date.now() + 60000) return -1;
  return t;
}

function openSheet(kind, j, entry){
  sheetKind = kind;
  editId = entry ? entry.id : null;
  var isC = kind === 'c';
  var isP = kind === 'p';
  sheetJ = entry && entry.k === 'w' ? jOf(entry) : (j || 'w');

  document.getElementById('sheetTitle').textContent =
    editId ? (isP ? '编辑排便' : '编辑记录') : (isC ? '记录导尿' : '记录水分');

  /* 水分类型选择：仅水分时显示 */
  var jrow = document.getElementById('jrow');
  jrow.style.display = (!isC && !isP) ? 'grid' : 'none';
  Array.prototype.forEach.call(jrow.querySelectorAll('[data-j]'), function(b){
    b.className = 'chipbtn' + (b.getAttribute('data-j') === sheetJ ? ' on' : '');
  });

  var hint = '';
  if(editId){
    hint = '改完点「保存」；也可以在下面直接删除';
  }else if(isC){
    var lc = lastCath();
    hint = lc ? '距上次导尿 ' + fmtDur(Date.now()-lc.t) : '这是第一条导尿记录';
  }else{
    var lw = lastWater();
    var tk = dayKey(Date.now()), s = 0;
    data.forEach(function(e){ if(e.k==='w' && dayKey(e.t)===tk) s += e.v; });
    hint = (lw ? '距上次摄入 ' + fmtDur(Date.now()-lw.t) + '　·　' : '') + '今日已摄入 ' + s + ' ml';
  }
  document.getElementById('sheetHint').textContent = hint;

  /* 数值区：排便只改时间 */
  document.getElementById('pickerBox').style.display = isP ? 'none' : 'flex';
  var chips = document.getElementById('chips');
  chips.style.display = isP ? 'none' : 'grid';
  chips.innerHTML = '';

  if(!isP){
    var presets = isC ? [100,130,150,180] : [50,100,150,200];
    presets.forEach(function(v){
      var b = document.createElement('button');
      b.className = 'chipbtn';
      b.type = 'button';
      b.textContent = v;
      b.onclick = function(){ setPicker(v); };
      chips.appendChild(b);
    });
    buildPicker(isC, entry ? entry.v : (isC ? CFG.DEF_CATH : CFG.DEF_WATER));
  }

  document.getElementById('dt').value = entry ? dateValue(entry.t) : dateValue(Date.now());
  document.getElementById('tm').value = entry ? hm(entry.t) : nowTimeValue();

  /* 只有编辑模式才出现「删除」 */
  document.getElementById('sheetDel').style.display = editId ? 'block' : 'none';
  document.getElementById('sheetActions').className = 'sheet-actions' + (editId ? ' edit' : '');

  document.getElementById('mask').className = 'mask open';
  document.getElementById('sheet').className = 'sheet open';

  if(!isP){
    setTimeout(function(){
      scrollToIdx(picker.idx, false);
      markPicker();
    }, 40);
  }
}

function setPicker(val){
  var i = picker.values.indexOf(val);
  if(i < 0){
    var min = picker.values[0] || 0;
    i = Math.min(picker.values.length-1, Math.max(0, Math.round((val-min)/(picker.step||1))));
  }
  scrollToIdx(i, true);
}

function closeSheet(){
  document.getElementById('mask').className = 'mask';
  document.getElementById('sheet').className = 'sheet';
  sheetKind = null;
  editId = null;
  try{ document.activeElement.blur(); }catch(e){}
}

function confirmSheet(){
  if(!sheetKind) return;
  var kind = sheetKind;

  var ts = readWhen();
  if(ts === null){ toast('请选择日期和时间', true); return; }
  if(ts === -1){ toast('时间不能晚于现在', true); return; }

  var v = 0;
  if(kind !== 'p'){
    v = pickerValue();
    if(!v || v <= 0){ toast('请选择数值', true); return; }
  }

  /* 编辑已有记录 */
  if(editId){
    var e = findEntry(editId);
    if(e){
      e.t = ts;
      if(kind !== 'p') e.v = v;
      if(e.k === 'w'){
        if(sheetJ === 's' || sheetJ === 'p') e.j = sheetJ;
        else delete e.j;
      }
      data.sort(function(a,b){ return a.t - b.t; });
      save();
      renderAll();
      buzz();
      toast('已修改');
    }
    closeSheet();
    return;
  }

  /* 新增 */
  var j = sheetJ;
  var rec = addEntry(kind, v, ts, j);
  closeSheet();

  var undo = function(){
    data = data.filter(function(x){ return x.id !== rec.id; });
    save();
    renderAll();
    toast('已撤销');
  };

  if(kind === 'c' && v >= CFG.MAX_ML){
    toast('已记录 ' + v + ' ml，已达到 ' + CFG.MAX_ML + ' ml 安全线', true, undo);
  }else if(kind === 'c'){
    toast('已记录导尿 ' + v + ' ml', false, undo);
  }else{
    toast('已记录' + JLIST[j] + ' ' + v + ' ml', false, undo);
  }
}

/* ====== 导出 CSV ====== */
function buildCsv(){
  var rows = [['日期','时间','事件','量(ml)','距上次同类型']];
  var prevC = null, prevW = null;
  data.forEach(function(e){
    var gap = '';
    if(e.k === 'c'){
      if(prevC) gap = fmtGap(e.t - prevC.t);
      prevC = e;
    }else if(e.k === 'w'){
      if(prevW) gap = fmtGap(e.t - prevW.t);
      prevW = e;
    }
    var name = e.k === 'c' ? '导尿' : (e.k === 'p' ? '排便' : JLIST[jOf(e)]);
    rows.push([ dayKey(e.t), hm(e.t), name, e.k === 'p' ? '' : e.v, gap ]);
  });
  return '\ufeff' + rows.map(function(r){ return r.join(','); }).join('\r\n');
}

/* 是否运行在 APK 内部（由原生注入 AndroidBridge） */
function nativeBridge(){
  try{
    if(window.AndroidBridge && window.AndroidBridge.hasNative && window.AndroidBridge.hasNative()){
      return window.AndroidBridge;
    }
  }catch(e){}
  return null;
}

/* UTF-8 字符串 -> Base64 */
function toBase64(str){
  var bytes = new TextEncoder().encode(str);
  var bin = '';
  for(var i=0;i<bytes.length;i++){ bin += String.fromCharCode(bytes[i]); }
  return btoa(bin);
}

/* 保存文本：APK 内交给原生写文件，浏览器走 Blob 下载 */
function saveText(name, mime, text){
  var nb = nativeBridge();
  if(nb){
    try{
      var b64 = toBase64(text);
      var ok = nb.saveFile ? nb.saveFile(name, mime, b64) : nb.saveCsv(name, b64);
      return !!ok;
    }catch(e){ return false; }
  }
  try{
    var blob = new Blob([text], {type: mime + ';charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    return true;
  }catch(e){ return false; }
}

function stamp(){
  var d = new Date();
  return dayKey(d.getTime()) + '_' + p2(d.getHours()) + p2(d.getMinutes());
}

function exportCsv(){
  if(data.length === 0){ toast('还没有数据可以导出'); return; }
  var name = '导尿记录_' + stamp() + '.csv';
  if(saveText(name, 'text/csv', buildCsv())) toast('已导出 CSV：' + name);
  else toast('导出失败，请重试', true);
}

/* ====== 备份 / 恢复 ====== */
function buildBackup(){
  return JSON.stringify({
    app: 'daoniao',
    version: 2,
    exportedAt: Date.now(),
    count: data.length,
    records: data
  }, null, 1);
}

/* 兼容两种文件：本 App 的备份对象，或一个裸数组 */
function parseBackup(text){
  var o;
  try{ o = JSON.parse(text); }catch(e){ return null; }
  var arr = Array.isArray(o) ? o : (o && Array.isArray(o.records) ? o.records : null);
  if(!arr) return null;
  var out = [], i;
  for(i=0;i<arr.length;i++){
    var e = arr[i];
    if(!e || typeof e.t !== 'number' || (e.k !== 'c' && e.k !== 'w' && e.k !== 'p')) continue;
    var r = {
      id: e.id ? String(e.id) : (String(e.t) + Math.random().toString(36).slice(2,7)),
      t: e.t,
      k: e.k,
      v: (typeof e.v === 'number' && isFinite(e.v)) ? e.v : 0
    };
    if(e.k === 'w' && (e.j === 's' || e.j === 'p')) r.j = e.j;
    out.push(r);
  }
  return out.length ? out : null;
}

function exportJson(quiet){
  if(data.length === 0){ toast('还没有数据'); return false; }
  var name = '导尿记录_备份_' + stamp() + '.json';
  var ok = saveText(name, 'application/json', buildBackup());
  if(ok){
    if(!quiet) toast('已备份 ' + data.length + ' 条：' + name);
  }else{
    toast('备份失败，请重试', true);
  }
  return ok;
}

function doRestore(text){
  var arr = parseBackup(text);
  if(!arr){ toast('这个文件不是备份文件', true); return; }
  if(!confirm('备份里有 ' + arr.length + ' 条记录，会替换当前的 ' + data.length + ' 条。\n先备份当前数据一份，再继续？')) return;
  exportJson(true);
  data = arr;
  data.sort(function(a,b){ return a.t - b.t; });
  save();
  renderAll();
  toast('已恢复 ' + arr.length + ' 条记录');
}

/* 新增后 5 秒内可撤销 */
function undoAdd(rec){
  return function(){
    data = data.filter(function(x){ return x.id !== rec.id; });
    save();
    renderAll();
    toast('已撤销');
  };
}

/* ====== 事件绑定 ====== */
document.getElementById('btnCath').onclick = function(){ openSheet('c'); };

/* 排便：一键记录当前时间，不需弹层 */
document.getElementById('btnPoo').onclick = function(){
  var rec = addEntry('p', 0, Date.now(), 'w');
  toast('已记录排便 ' + hm(rec.t), false, undoAdd(rec));
};

Array.prototype.forEach.call(document.querySelectorAll('[data-w]'), function(b){
  b.onclick = function(){
    var v = parseInt(b.getAttribute('data-w'), 10);
    if(v === 0){ openSheet('w', 'w'); return; }
    var rec = addEntry('w', v, Date.now(), 'w');
    toast('已记录喝水 ' + v + ' ml', false, undoAdd(rec));
  };
});

/* 水分类型切换 */
Array.prototype.forEach.call(document.querySelectorAll('[data-j]'), function(b){
  b.onclick = function(){
    sheetJ = b.getAttribute('data-j');
    var row = document.getElementById('jrow');
    Array.prototype.forEach.call(row.querySelectorAll('[data-j]'), function(x){
      x.className = 'chipbtn' + (x.getAttribute('data-j') === sheetJ ? ' on' : '');
    });
  };
});

/* 列表：点 × 删除（可撤销），点整行进编辑 */
document.getElementById('list').onclick = function(ev){
  var node = ev.target;
  while(node && node !== this &&
        !(node.getAttribute && (node.getAttribute('data-del') || node.getAttribute('data-edit')))){
    node = node.parentNode;
  }
  if(!node || node === this) return;

  var delId = node.getAttribute && node.getAttribute('data-del');
  if(delId){ delEntry(delId); return; }

  var id = node.getAttribute && node.getAttribute('data-edit');
  var e = id ? findEntry(id) : null;
  if(e) openSheet(e.k, jOf(e), e);
};

document.getElementById('btnCsv').onclick = exportCsv;
document.getElementById('btnBackup').onclick = function(){ exportJson(false); };

document.getElementById('btnRestore').onclick = function(){
  if(data.length > 0 && !confirm('恢复会覆盖当前记录。\n建议先点「备份数据」导出一份。继续吗？')) return;
  document.getElementById('fileIn').click();
};

document.getElementById('fileIn').onchange = function(){
  var f = this.files && this.files[0];
  if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){ doRestore(String(rd.result)); };
  rd.onerror = function(){ toast('读不到这个文件', true); };
  rd.readAsText(f);
  this.value = '';
};

document.getElementById('toastUndo').onclick = runUndo;

document.getElementById('sheetDel').onclick = function(){
  if(!editId) return;
  var id = editId;
  closeSheet();
  delEntry(id);
};

document.getElementById('btnClear').onclick = function(){
  if(data.length === 0){ toast('没有数据'); return; }
  if(!confirm('确定要清空全部 ' + data.length + ' 条记录吗？此操作无法撤销。\n建议先点「备份数据」。')) return;
  if(!confirm('再次确认：真的要全部删除吗？')) return;
  data = [];
  save();
  renderAll();
  toast('已清空');
};

document.getElementById('mask').onclick = closeSheet;
document.getElementById('sheetCancel').onclick = closeSheet;
document.getElementById('sheetOk').onclick = confirmSheet;

/* 滚轮：鼠标滚 / 触摸滑动均可 */
document.getElementById('pwrap').addEventListener('wheel', function(e){
  e.preventDefault();
  if(picker.wrap){
    picker.wrap.scrollTop += (e.deltaY > 0 ? 44 : -44);
  }
}, {passive:false});

/* ====== 启动 ====== */
renderAll();
setInterval(renderStatus, 20000);
document.addEventListener('visibilitychange', function(){
  if(!document.hidden) renderStatus();
});

/* ====== PWA：离线缓存（仅 http/https 生效） ====== */
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

/* ====== 自测钩子（tests/selftest.html 用，不影响正常功能） ====== */
window.DN = {
  CFG: CFG, CUR: CUR, median: median, computeBaseline: computeBaseline,
  dayKey: dayKey, hm: hm, dateValue: dateValue, readWhen: readWhen,
  fmtGap: fmtGap, fmtDur: fmtDur, buildCsv: buildCsv,
  buildBackup: buildBackup, parseBackup: parseBackup, isNight: isNight,
  openSheet: openSheet, closeSheet: closeSheet, findEntry: findEntry,
  getData: function(){ return data; },
  setData: function(a, noSave){
    data = a;
    data.sort(function(x,y){ return x.t - y.t; });
    if(!noSave) save();
    renderAll();
  }
};

})();
