apply plugin: 'com.android.application'

android {
    namespace 'com.frank.daoniao'
    compileSdk 34

    defaultConfig {
        applicationId "com.frank.daoniao"
        minSdk 22
        targetSdk 34
        versionCode 12
        versionName "1.0.12"
    }

    signingConfigs {
        debug {
            /* CI 里由 keytool 生成并缓存；本地不设置该环境变量时用 AGP 默认 keystore */
            def defKs = System.getenv('DEBUG_KEYSTORE')
            if (defKs != null && !defKs.isEmpty()) {
                storeFile file(defKs)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
