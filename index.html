<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="导尿记录">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>导尿记录</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  background:#eef1f5;color:#0f172a;font-size:16px;-webkit-text-size-adjust:100%;
  padding:12px 12px calc(104px + env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;
  user-select:none;overflow-x:hidden;
}
.card{background:#fff;border-radius:18px;padding:16px 16px 14px;box-shadow:0 1px 3px rgba(15,23,42,.07);margin-bottom:12px}

/* ---------- 状态卡 ---------- */
.stat-label{font-size:13px;color:#64748b;font-weight:600;letter-spacing:.3px}
.stat-main{display:flex;align-items:center;gap:10px;margin-top:2px;flex-wrap:wrap}
.big{font-size:clamp(32px,10.5vw,44px);font-weight:800;line-height:1.15;letter-spacing:-1px;font-variant-numeric:tabular-nums;color:#0f172a}
.big.none{color:#94a3b8}
.big.warn{color:#b45309}
.big.late{color:#b91c1c}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;background:#eef2f7;color:#475569;white-space:nowrap}
.badge.ok{background:#dcfce7;color:#15803d}
.badge.warn{background:#fef3c7;color:#b45309}
.badge.late{background:#fee2e2;color:#b91c1c}
.stat-sub{font-size:13.5px;color:#64748b;margin-top:6px;font-variant-numeric:tabular-nums}
.stat-div{height:1px;background:#f1f5f9;margin:12px 0 10px}
.today{font-size:14px;color:#334155;line-height:1.75;font-variant-numeric:tabular-nums}
.today b{font-weight:800;font-size:15.5px;color:#0f172a}
.today .seg{white-space:nowrap}
.tsum{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px;font-size:13.5px;color:#334155;
  font-variant-numeric:tabular-nums}
.tsum .it{white-space:nowrap}
.tsum .it b{font-size:14.5px;font-weight:800;color:#0f172a;margin:0 1px}
.over{color:#dc2626;font-weight:700}

/* ---------- 主按钮 ---------- */
/* 固定在底部（拇指区），滚动时常驻 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;
  display:grid;grid-template-columns:2.15fr 1fr;gap:8px;
  padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;
  background:linear-gradient(to bottom,rgba(238,241,245,0) 0%,#eef1f5 40%)}
.dock .btn{padding:15px 8px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-radius:16px;
  padding:14px 8px;font-size:19px;font-weight:800;
  color:#fff;background:#2563eb;box-shadow:0 2px 8px rgba(37,99,235,.20);
  font-family:inherit;letter-spacing:.5px}
.btn:active{transform:translateY(1px);box-shadow:0 1px 4px rgba(37,99,235,.18)}
.btn-poo{background:#f1f5f9;color:#7c4a1e;box-shadow:none;font-size:15px;font-weight:800;
  flex-direction:column;gap:1px;line-height:1.15;letter-spacing:0;padding:10px 4px}
.btn-poo:active{background:#e2e8f0;transform:translateY(1px);box-shadow:none}
.btn-poo .em{font-size:16px;line-height:1}

/* ---------- 喝水行 ---------- */
.water-row{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:5px;align-items:center;margin-bottom:14px}
.water-label{font-size:15px;font-weight:700;color:#0e7490;white-space:nowrap;padding-right:1px}
.chipbtn{border:0;border-radius:12px;padding:14px 0;font-size:14.5px;font-weight:700;min-width:0;overflow:hidden;
  background:#e0f2fe;color:#075985;font-family:inherit;font-variant-numeric:tabular-nums}
.chipbtn:active{background:#bae6fd}
.chipbtn.alt{background:#f1f5f9;color:#475569}
.chipbtn.alt:active{background:#e2e8f0}

/* ---------- 列表 ---------- */
.list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.list-head .t{font-size:16px;font-weight:800}
.list-head .tools{display:flex;gap:2px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.list-head .link{font-size:13px}
.link{border:0;background:transparent;color:#2563eb;font-size:14px;font-weight:700;padding:6px 4px;font-family:inherit}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
  padding:14px 0 5px;font-size:12.5px;color:#64748b;font-weight:700;border-top:1px solid #f1f5f9;
  position:sticky;top:0;z-index:3;background:#fff;box-shadow:0 -8px 0 #fff}
.dh:first-child{border-top:0;padding-top:8px}
.dh .sum{font-weight:600;color:#94a3b8;font-variant-numeric:tabular-nums;text-align:right;margin-left:auto}
.rec{display:flex;align-items:center;gap:9px;padding:11px 0;border-top:1px solid #f8fafc}
.rec .rt{width:52px;flex:none;font-size:15px;color:#64748b;font-variant-numeric:tabular-nums}
.rec .tag{flex:none;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.tag.c{background:#e0e7ff;color:#3730a3}
.tag.w{background:#cffafe;color:#0e7490}
.rec .rv{margin-left:auto;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.rv .u{font-size:11px;font-weight:700;color:#94a3b8;margin-left:2px}
.rec .x{border:0;background:transparent;color:#cbd5e1;font-size:22px;line-height:1;padding:2px 8px;font-family:inherit}
.rec .x:active{color:#ef4444}
.warnmark{color:#dc2626;font-size:11.5px;font-weight:800;margin-left:6px;vertical-align:1px}
.empty{color:#94a3b8;font-size:14px;text-align:center;padding:22px 0}
.foot{display:flex;justify-content:center;gap:18px;padding:6px 0 2px}
.foot button{border:0;background:transparent;color:#94a3b8;font-size:12.5px;padding:8px;font-family:inherit}

/* ---------- 三列：时间 / 事件 / 数量 ---------- */
.seg{display:inline-flex;background:#f1f5f9;border-radius:10px;padding:3px;gap:2px;margin:6px 0 4px}
.seg button{border:0;background:transparent;color:#64748b;font-family:inherit;
  font-size:13.5px;font-weight:800;padding:7px 16px;border-radius:8px;white-space:nowrap}
.seg button.on{background:#fff;color:#0f172a;box-shadow:0 1px 3px rgba(15,23,42,.12)}
.seg button.on.c{color:#3730a3}
.seg button.on.w{color:#0e7490}

.tr{display:grid;grid-template-columns:56px 1fr auto;align-items:center;column-gap:8px;
  padding:9px 2px;border-top:1px solid #f4f7fb;min-width:0}
.tr:first-child{border-top:0}
.tr .c1{font-size:14.5px;color:#64748b;font-variant-numeric:tabular-nums;white-space:nowrap}
.tr .c2{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .c2 .jt{display:inline-block;font-size:10px;font-weight:800;padding:1px 4px;border-radius:4px;
  margin-right:4px;vertical-align:1.5px;background:#e0f2fe;color:#0369a1}
.tr .c2 .jt.s{background:#fef3c7;color:#b45309}
.tr .c2 .jt.p{background:#dcfce7;color:#15803d}
.tr.ev-c .c2{color:#3730a3}
.tr.ev-w .c2{color:#0e7490}
.tr.ev-p .c2{color:#92400e}
.tr .c3{display:flex;align-items:center;gap:4px;justify-self:end;font-weight:800;font-size:16.5px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tr .c3 .u{font-size:11px;font-weight:700;color:#94a3b8;margin-left:1px}
.tr .c3 .x{border:0;background:transparent;color:#d7dee8;font-size:19px;line-height:1;
  padding:8px 4px;margin:-8px -2px -8px 0;font-family:inherit}
.tr .c3 .x:active{color:#ef4444}
.tr.over{background:#fef2f2}
.tr.over .c3{color:#dc2626}
.tr.poo .c3{color:#92400e;font-size:14px}
.tr .sub{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:2px 10px;
  font-size:11.5px;font-weight:700;color:#94a3b8;font-variant-numeric:tabular-nums;
  margin-top:2px;line-height:1.3}
.tr .sub .it{white-space:nowrap}
.tr .sub .it.hot{color:#f59e0b}
.tr .sub .it.bad{color:#dc2626}
.tr .sub .it.ok{color:#16a34a}
.tr .nightmark{display:inline-block;font-size:9.5px;font-weight:800;padding:0 3px;border-radius:3px;
  background:#e2e8f0;color:#475569;margin-right:3px;vertical-align:1.5px}
.tr .warnmark{display:inline-block;font-size:10.5px;font-weight:800;border-radius:4px;
  padding:1px 4px;margin-left:5px;vertical-align:1.5px}
.tr .warnmark.low{color:#64748b;background:#f1f5f9}
.tr .warnmark.more{color:#b45309;background:#fef3c7}
.tr .warnmark.over{color:#dc2626;background:#fee2e2}

/* ---------- 月份折叠（两层：月 → 日） ---------- */
.mh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;
  margin:16px 0 4px;padding:10px 12px 9px;border-radius:13px;background:#f1f5f9;
  font-size:14px;font-weight:800;color:#0f172a;cursor:pointer;user-select:none;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;min-width:0}
.mh:first-child{margin-top:6px}
.mh .mf{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto}
.mh .mcaret{display:inline-block;font-size:9px;color:#94a3b8;transition:transform .15s}
.mh.closed .mcaret{transform:rotate(-90deg)}
.mh .mnum{flex:1 0 100%;min-width:0;font-weight:600;font-size:12px;color:#64748b;
  font-variant-numeric:tabular-nums;text-align:left;line-height:1.35}
.mbody{display:block}
.mh.closed + .mbody{display:none}
.loadmore{display:block;width:100%;border:1px dashed #cbd5e1;background:transparent;color:#64748b;
  font-size:13.5px;font-weight:700;font-family:inherit;padding:13px;border-radius:12px;margin:16px 0 4px}
.loadmore:active{background:#f1f5f9}

/* 长按水量键 → 选类型 */
.qmenu{position:fixed;left:50%;bottom:132px;z-index:30;width:min(88vw,340px);
  transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;
  background:#fff;border-radius:18px;box-shadow:0 12px 34px rgba(15,23,42,.22);padding:13px 14px;
  transition:opacity .14s,transform .14s}
.qmenu.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.qmenu .qt{font-size:12.5px;font-weight:800;color:#64748b;text-align:center;margin-bottom:10px}
.qmenu .qr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qmenu .qr button{border:0;border-radius:11px;padding:13px 4px;font-size:15px;font-weight:800;
  font-family:inherit;background:#f1f5f9;color:#334155}
.qmenu .qr button:active{background:#e2e8f0}

/* 滚轮 ±10 */
.pstep{border:0;background:#f1f5f9;color:#475569;font-weight:800;font-size:14px;
  width:46px;height:46px;border-radius:50%;font-family:inherit;flex:none;-webkit-tap-highlight-color:transparent}
.pstep:active{background:#e2e8f0}

/* ---------- 复诊简报 ---------- */
.rep{font-size:14.5px;line-height:1.7;color:#0f172a;max-height:54vh;overflow:auto;
  padding:2px 2px 6px;-webkit-overflow-scrolling:touch}
.rep h4{font-size:12px;color:#94a3b8;font-weight:800;margin:15px 0 5px;letter-spacing:.03em}
.rep h4:first-child{margin-top:0}
.rep .line{display:flex;justify-content:space-between;gap:12px;padding:3px 0;
  border-bottom:1px dashed #f1f5f9;font-variant-numeric:tabular-nums}
.rep .line span:first-child{flex:0 0 auto;white-space:nowrap;color:#64748b}
.rep .line span:last-child{flex:1 1 auto;min-width:0;text-align:right;font-weight:700}
.rep b{font-weight:800;color:#0f172a;font-variant-numeric:tabular-nums}
.rep .warn{color:#dc2626}
.rep .ok{color:#16a34a}
.rep .dim{color:#94a3b8;font-weight:600}
.rep .flag{display:flex;align-items:baseline;gap:7px;padding:3px 0;font-weight:700;color:#334155}
.rep .flag i{font-style:normal;color:#cbd5e1;font-weight:900;font-size:12px}
.seg2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 4px;
  background:#f1f5f9;border-radius:12px;padding:4px}
.seg2 button{border:0;background:transparent;font-family:inherit;font-size:13.5px;font-weight:800;
  color:#64748b;padding:9px 2px;border-radius:9px}
.seg2 button.on{background:#fff;color:#0f172a;box-shadow:0 1px 3px rgba(15,23,42,.12)}

/* ---------- 设置 ---------- */
.setscroll{max-height:56vh;overflow:auto;-webkit-overflow-scrolling:touch;margin-top:6px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:14px;color:#334155;font-weight:700}
.setrow:last-child{border-bottom:0}
.setrow .sv{display:flex;align-items:center;gap:5px;color:#0f172a;font-weight:700;font-size:13.5px}
.setrow input{border:1px solid #e2e8f0;border-radius:9px;padding:7px 8px;font-size:15px;
  font-family:inherit;color:#0f172a;background:#f8fafc;font-variant-numeric:tabular-nums;
  width:84px;text-align:right;-webkit-appearance:none;appearance:textfield}
.setrow input::-webkit-outer-spin-button,
.setrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.setrow input[type=date]{width:146px;text-align:left}
.backinfo{font-size:11.5px;color:#94a3b8;text-align:center;padding:4px 0 0;line-height:1.5}

/* ---------- 可折叠的日期 ---------- */
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
  padding:13px 0 6px;margin-top:6px;font-size:12.5px;color:#64748b;font-weight:700;
  border-top:1px solid #eef2f7;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dh:first-child{border-top:0;margin-top:0;padding-top:4px}
.dh .dt{display:flex;align-items:center;gap:5px}
.dh .caret{display:inline-block;font-size:9px;color:#94a3b8;transition:transform .15s;transform:rotate(0deg)}
.dh.closed .caret{transform:rotate(-90deg)}
.dh .sum{font-weight:600;color:#94a3b8;font-variant-numeric:tabular-nums;text-align:right;margin-left:auto}
.day-body{display:block}
.dh.closed + .day-body{display:none}

/* 筛选提示 */
.fempty{color:#94a3b8;font-size:13.5px;text-align:center;padding:26px 0}

/* ---------- 底部弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.32);opacity:0;pointer-events:none;transition:opacity .18s;z-index:20}
.mask.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;transform:translateY(102%);transition:transform .2s ease;
  padding:0 8px calc(8px + env(safe-area-inset-bottom));pointer-events:none}
.sheet.open{transform:translateY(0);pointer-events:auto}
.sheet-box{background:#fff;border-radius:22px;padding:18px 16px calc(16px + env(safe-area-inset-bottom));
  max-width:504px;margin:0 auto;box-shadow:0 -6px 30px rgba(15,23,42,.16)}
.sheet-title{font-size:18px;font-weight:800;text-align:center}
.sheet-hint{font-size:13px;color:#64748b;text-align:center;margin-top:5px;min-height:18px;font-variant-numeric:tabular-nums}
.amt{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:14px 0 12px}
.amt input{width:62%;border:0;border-bottom:2.5px solid #e2e8f0;background:transparent;text-align:center;
  font-size:40px;font-weight:800;color:#0f172a;font-family:inherit;padding:4px 0;outline:none;
  font-variant-numeric:tabular-nums;border-radius:0;
  -webkit-appearance:none;appearance:textfield;-moz-appearance:textfield}
.amt input::-webkit-outer-spin-button,
.amt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.amt input:focus{border-bottom-color:#2563eb}
.amt .unit{font-size:17px;font-weight:700;color:#94a3b8}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:12px}
.chips .chipbtn{font-size:16px}
.timerow{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;
  color:#64748b;font-weight:600;margin-bottom:14px}
.timerow input{border:1px solid #e2e8f0;border-radius:10px;padding:9px 12px;font-size:16px;
  font-family:inherit;color:#0f172a;background:#f8fafc;font-variant-numeric:tabular-nums}
.sheet-actions{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.sheet-actions button{border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:800;font-family:inherit}
.btn-ghost{background:#f1f5f9;color:#475569}
.btn-main{background:#2563eb;color:#fff}
.btn-main:active{background:#1d4ed8}

/* ---------- 滚轮选择器 ---------- */
.picker{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 14px;position:relative}
.picker .col{min-width:0;flex:none}
.pwrap{height:132px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;width:92px;position:relative;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent);
  mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent)}
.pwrap::-webkit-scrollbar{display:none}
.pitem{height:44px;line-height:44px;text-align:center;font-size:19px;font-weight:700;
  color:#cbd5e1;scroll-snap-align:center;font-variant-numeric:tabular-nums}
.pitem.sel{color:#0f172a;font-size:23px;font-weight:800}
.pitem.sel.over{color:#dc2626}
.pind{position:absolute;left:0;right:0;top:50%;height:44px;margin-top:-22px;pointer-events:none;
  border-top:1.5px solid #e2e8f0;border-bottom:1.5px solid #e2e8f0;background:rgba(37,99,235,.04);border-radius:10px}
.punit{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:700;color:#94a3b8}

/* ---------- 水分类型选择 ---------- */
.jrow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.jrow .chipbtn{padding:12px 0;font-size:15px}
.jrow .chipbtn.on{background:#0e7490;color:#fff;box-shadow:0 2px 8px rgba(14,116,144,.3)}

/* ---------- 备份列表 ---------- */
.rlist{max-height:46vh;overflow-y:auto;margin:12px 0 14px;
  border:1px solid #eef2f7;border-radius:12px}
.ritem{display:flex;align-items:center;gap:8px;padding:13px 12px;border-top:1px solid #f4f7fb}
.ritem:first-child{border-top:0}
.ritem:active{background:#f8fafc}
.ritem .rmain{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
.ritem .rn{font-size:14.5px;font-weight:800;color:#0f172a;font-variant-numeric:tabular-nums}
.ritem .rs{font-size:11.5px;font-weight:700;color:#94a3b8}
.ritem .rx{border:0;background:transparent;color:#cbd5e1;font-family:inherit;
  font-size:12.5px;font-weight:700;padding:6px 8px;border-radius:8px}
.ritem .rx:active{color:#ef4444;background:#fef2f2}

/* ---------- 提示条 ---------- */
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translate(-50%,16px);
  background:#0f172a;color:#fff;font-size:14.5px;font-weight:600;padding:12px 18px;border-radius:12px;
  opacity:0;pointer-events:none;transition:all .22s;z-index:40;max-width:88vw;text-align:center;line-height:1.4}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:#b91c1c}

/* 弹层打开时，提示条挪到顶部，免得挡住弹层按钮 */
.sheet.open ~ .toast{bottom:auto;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-14px)}
.sheet.open ~ .toast.show{transform:translate(-50%,0)}

/* ---------- v1.1：撤销 / 夜间 / 编辑 ---------- */
.toast.show.hasundo{pointer-events:auto}
.toast .undo{border:0;background:#fff;color:#0f172a;font-weight:800;font-size:14px;
  padding:6px 12px;border-radius:9px;font-family:inherit;white-space:nowrap}
.toast .undo:active{background:#e2e8f0}

<script>
(function(){
'use strict';

/* ====== 参数：要改只改这里 ====== */
var CFG = {
  /* ===== 按年龄算「预计膀胱容量」EBC：30 × (年龄 + 1) ml =====
     5 岁 ≈ 180 ml。单次导尿量拿它当上限，不再用成人 400 ml。
     填了生日就按生日自动长一岁；留空则用 AGE_Y。 */
  BIRTH    : '',    // 'YYYY-MM-DD'，可留空
  AGE_Y    : 5,     // 没填生日时的年龄（岁）
  VOL_LOW  : 1/3,   // 低于 EBC 的 1/3 → 偏少（60 ml）
  VOL_HIGH : 1,     // 高于 EBC → 偏多（180 ml，黄）
  VOL_HARD : 1.2,   // 高于 1.2×EBC → 超量（216 ml，红）
  GAP_SHORT: 2,     // 小时：短于 → 偏短
  GAP_LONG : 4,     // 小时：长于 → 偏长（黄）
  GAP_OVER : 5,     // 小时：长于 → 过长（红）
  MORE_X   : 1.5,   // （旧）超过个人中位数的倍数；保留兼容
  BASE_DAYS: 14,    // 个人基线统计窗口（天）
  BASE_MIN : 5,     // 至少有 5 个间隔样本才启用个人基线
  GAP_WARN : 1.3,   // 超过个人中位间隔 1.3 倍 → 偏久
  GAP_LATE : 1.6,   // 超过 1.6 倍 → 已超时
  DAY_H    : 3,     // 样本不足时退回的默认间隔（小时）
  NIGHT_H  : 8,     // 夜间阈值（只显示，不报警）
  NIGHT_S  : 22,    // 夜间开始 22:00
  NIGHT_E  : 6,     // 夜间结束 06:00
  DEF_CATH : 150,   // 导尿默认量
  DEF_WATER: 150,   // 水分默认量
  STEP_CATH : 1,    // 导尿滚轮精度 1ml
  STEP_WATER: 5,    // 水分滚轮精度 5ml
  MIN_CATH : 10,    // 导尿最小 10ml
  MAX_CATH : 800,   // 导尿可录入的最大值（能记进去，才可能被如实记下来）
  MIN_WATER: 5,
  MAX_WATER: 1000,
  KEY      : 'cathlog_v1'
};

/* ====== 设置持久化（生日/夜间时段/默认值等，存在 cathlog_cfg_v1） ====== */
var CFGKEY = 'cathlog_cfg_v1';
var CFG_SAVE = ['BIRTH','AGE_Y','VOL_LOW','VOL_HIGH','VOL_HARD','GAP_SHORT','GAP_LONG',
                'GAP_OVER','NIGHT_S','NIGHT_E','DEF_CATH','DEF_WATER'];

function cfgLoad(){
  try{
    var s = localStorage.getItem(CFGKEY);
    if(!s) return;
    var o = JSON.parse(s);
    if(!o || typeof o !== 'object') return;
    for(var i=0;i<CFG_SAVE.length;i++){
      var k = CFG_SAVE[i];
      if(o.hasOwnProperty(k) && typeof o[k] === typeof CFG[k]) CFG[k] = o[k];
    }
  }catch(e){}
}
function cfgSave(){
  try{
    var o = {};
    for(var i=0;i<CFG_SAVE.length;i++) o[CFG_SAVE[i]] = CFG[CFG_SAVE[i]];
    localStorage.setItem(CFGKEY, JSON.stringify(o));
  }catch(e){}
}
cfgLoad();

/* ====== 界面状态持久化（筛选/折叠/加载月数/上次备份） ====== */
var UIKEY = 'cathlog_ui_v1';
var UI = { filter:'all', cm:{}, cd:{}, months:6, lastBackup:0 };
function uiLoad(){
  try{
    var s = localStorage.getItem(UIKEY);
    if(!s) return;
    var o = JSON.parse(s);
    if(!o || typeof o !== 'object') return;
    if(o.filter) UI.filter = o.filter;
    if(o.cm && typeof o.cm === 'object') UI.cm = o.cm;
    if(o.cd && typeof o.cd === 'object') UI.cd = o.cd;
    if(o.months) UI.months = o.months;
    if(o.lastBackup) UI.lastBackup = o.lastBackup;
  }catch(e){}
}
function uiSave(){
  try{
    localStorage.setItem(UIKEY, JSON.stringify({
      filter: UI.filter, cm: UI.cm, cd: UI.cd, months: UI.months, lastBackup: UI.lastBackup
    }));
  }catch(e){}
}
uiLoad();

/* 水分类型 */
var JLIST = { w:'喝水', s:'喝汤', p:'喝粥' };
var JCLS  = { w:'', s:'s', p:'p' };

/* ====== 存储（无 localStorage 时降级为内存） ====== */
var data = [];
function load(){
  try{ var s = localStorage.getItem(CFG.KEY); if(s){ var a = JSON.parse(s); if(Array.isArray(a)) return a; } }catch(e){}
  return [];
}
function save(){
  try{ localStorage.setItem(CFG.KEY, JSON.stringify(data)); }catch(e){}
}
data = load();
data.sort(function(a,b){ return a.t - b.t; });

/* ====== 工具 ====== */
function p2(n){ return n<10 ? '0'+n : ''+n; }
function dayKey(ts){ var d=new Date(ts); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function startOfDay(ts){ var d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function earliestTs(){ return data.length ? data[0].t : Date.now(); }
function monthKey(ts){ var d=new Date(ts); return d.getFullYear()+'-'+p2(d.getMonth()+1); }
function monthLabel(mk){ var p=mk.split('-'); return p[0]+'年'+(parseInt(p[1],10))+'月'; }
function hm(ts){ var d=new Date(ts); return p2(d.getHours())+':'+p2(d.getMinutes()); }
function isNight(ts){ var h=new Date(ts).getHours(); return (h>=CFG.NIGHT_S || h<CFG.NIGHT_E); }
function dayLabel(ts){
  var d=new Date(ts), now=new Date(), w=['周日','周一','周二','周三','周四','周五','周六'];
  var s = (d.getMonth()+1)+'月'+d.getDate()+'日 '+w[d.getDay()];
  if(dayKey(ts)===dayKey(now.getTime())) s = '今天 · '+s;
  else{
    var y=new Date(now.getTime()-86400000);
    if(dayKey(ts)===dayKey(y.getTime())) s = '昨天 · '+s;
  }
  return s;
}
function fmtDur(ms){
  var m = Math.floor(ms/60000);
  if(m < 1) return '刚刚';
  var h = Math.floor(m/60), mm = m%60;
  if(h === 0) return mm+'分';
  return h+'小时'+mm+'分';
}

/* 紧凑间隔：3h28min */
function fmtGap(ms){
  var m = Math.floor(ms/60000);
  if(m < 1) return '0min';
  if(m >= 1440){
    var d = Math.floor(m/1440), rh = Math.floor((m%1440)/60);
    return d+'天'+(rh ? rh+'h' : '');
  }
  var h = Math.floor(m/60), mm = m%60;
  if(h === 0) return mm+'min';
  if(mm === 0) return h+'h';
  return h+'h'+p2(mm)+'min';
}

/* ====== 个人基线：最近 14 天的中位数 ====== */
var CUR = { n:0, gapMs:CFG.DAY_H*3600000, gapOK:false, volMed:0, volOK:false };

function median(arr){
  if(!arr || !arr.length) return 0;
  var a = arr.slice().sort(function(x,y){ return x - y; });
  var m = Math.floor(a.length/2);
  return (a.length % 2) ? a[m] : (a[m-1] + a[m]) / 2;
}

/* 用最近 BASE_DAYS 天的记录，算出「平时多久一次」「平时一次多少」。
   基线是描述性的，不是医嘱：它只用来判断“跟平常比怎么样”。 */
function computeBaseline(){
  var cut = Date.now() - CFG.BASE_DAYS*86400000;
  var cs = [], i;
  for(i=0;i<data.length;i++){ var e=data[i]; if(e.k==='c' && e.t>=cut) cs.push(e); }

  var gaps = [], vols = [];
  for(i=1;i<cs.length;i++){
    var g = cs[i].t - cs[i-1].t;
    if(g > 10*60000 && g <= 12*3600000) gaps.push(g);   /* 排除误触和跨夜中断 */
  }
  for(i=0;i<cs.length;i++){ if(cs[i].v > 0) vols.push(cs[i].v); }

  CUR.n      = cs.length;
  CUR.gapOK  = gaps.length >= CFG.BASE_MIN;
  CUR.gapMs  = CUR.gapOK ? median(gaps) : CFG.DAY_H*3600000;
  CUR.volOK  = vols.length >= CFG.BASE_MIN;
  CUR.volMed = CUR.volOK ? median(vols) : 0;
  return CUR;
}

/* ====== 年龄 → 预计膀胱容量（EBC）======
   ICCS 常用：EBC(ml) = 30 × (年龄 + 1)，4–12 岁适用。
   5 岁 = 180 ml。个体差异 ±30 ml，最终以尿动力学「安全容量」为准。 */
function ageYears(){
  if(CFG.BIRTH){
    var b = new Date(CFG.BIRTH);
    if(!isNaN(b.getTime())){
      var n = new Date(), y = n.getFullYear() - b.getFullYear();
      if(n.getMonth() < b.getMonth() ||
         (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) y--;
      if(y >= 1 && y <= 18) return y;
    }
  }
  return CFG.AGE_Y;
}
function ebcMl(){ return 30 * (ageYears() + 1); }
function volLine(){
  var e = ebcMl();
  return { low: Math.round(e*CFG.VOL_LOW), high: Math.round(e*CFG.VOL_HIGH), hard: Math.round(e*CFG.VOL_HARD) };
}

/* 单次导尿量：<1/3 EBC 偏少，1/3–1 EBC 合适，1–1.2 偏多，>1.2 超量 */
function assessVol(v){
  var L = volLine();
  if(v <= 0)       return { k:'', t:'' };
  if(v < L.low)    return { k:'low',  t:'偏少' };
  if(v > L.hard)   return { k:'over', t:'超量' };
  if(v > L.high)   return { k:'more', t:'偏多' };
  return { k:'ok', t:'' };
}

/* 间隔：<2h 偏短，2–4h 适中，4–5h 偏长，>5h 过长（夜间不判） */
function assessGap(ms){
  var h = ms/3600000;
  if(h < CFG.GAP_SHORT) return { k:'short', t:'偏短' };
  if(h > CFG.GAP_OVER)  return { k:'over',  t:'过长' };
  if(h > CFG.GAP_LONG)  return { k:'long',  t:'偏长' };
  return { k:'ok', t:'' };
}

/* 水分类型（兼容旧记录：无 j 字段视为喝水） */
function jOf(e){
  if(e.k !== 'w') return '';
  return (e.j === 's' || e.j === 'p') ? e.j : 'w';
}

/* 是否排便记录（k='p'，只记时间） */
function isPoo(e){ return e.k === 'p'; }

/* ====== 提示条（可带「撤销」） ====== */
var toastTimer = null, undoFn = null;

/* 轻震一下：APK 里有 VIBRATE 权限时生效，浏览器里多数无效，失败就静默 */
function buzz(){

}

function hideToast(){
  document.getElementById('toast').className = 'toast';
  /* 按钮也要藏回去，否则下一条只有文字的提示会露出旧回调的「撤销」 */

}

/* ====== 状态区 ====== */
function lastCath(){
  for(var i=data.length-1;i>=0;i--){ if(data[i].k==='c') return data[i]; }
  return null;
}

/* 上一次水分摄入（喝水/喝汤/喝粥 均算） */
function lastWater(){
  for(var i=data.length-1;i>=0;i--){ if(data[i].k==='w') return data[i]; }
  return null;
}

function renderStatus(){
  var now = Date.now();
  var lc = lastCath();
  var elE = document.getElementById('elapsed');
  var elB = document.getElementById('badge');
  var elL = document.getElementById('lastInfo');

  var b = computeBaseline();

  /* 距上次饮水：无论有没有导尿记录都算，放在主信息下方 */
  var lw0 = lastWater();
  var waterLine;
  if(lw0){
    waterLine = '距上次饮水 <b>' + fmtDur(now - lw0.t) + '</b> · ' + hm(lw0.t) +
                ' ' + JLIST[jOf(lw0)] + ' ' + lw0.v + ' ml';
  }else{
    waterLine = '还没有饮水记录';
  }

  if(!lc){
    elE.textContent = '—';
    elE.className = 'big none';
    elB.className = 'badge';
    elB.textContent = '无记录';
    elL.innerHTML = '还没有导尿记录，点下面的蓝色按钮开始<br>' + waterLine;
  }else{
    var ms = now - lc.t;
    elE.textContent = fmtDur(ms);

    var cls, txt;
    if(isNight(now)){
      cls=''; txt='夜间';
    }else if(b.gapOK){
      var r = ms / b.gapMs;
      if(r < CFG.GAP_WARN){ cls='ok'; txt='正常'; }
      else if(r < CFG.GAP_LATE){ cls='warn'; txt='偏久'; }
      else { cls='late'; txt='已超时'; }
    }else{
      var h = ms/3600000;
      if(h < CFG.DAY_H){ cls='ok'; txt='正常'; }
      else if(h < CFG.DAY_H+0.5){ cls='warn'; txt='偏久'; }
      else { cls='late'; txt='已超时'; }
    }
    elE.className = 'big' + (cls ? ' '+cls : '');
    elB.className = 'badge' + (cls ? ' '+cls : '');
    elB.textContent = txt;

    var isToday = dayKey(lc.t) === dayKey(now);
    var when = isToday ? hm(lc.t) : dayLabel(lc.t).replace(' · ',' ') + ' ' + hm(lc.t);
    var info = '上次 ' + when + ' · ' + lc.v + ' ml';
    if(!isNight(now)){
      info += ' ｜ 平时 ' + fmtGap(b.gapMs) + ' · 预计 ' + hm(lc.t + b.gapMs);
    }
    elL.innerHTML = info + '<br>' + waterLine;
  }

  /* 今日汇总（次要信息压成一行，明细在列表里看） */
  var tk = dayKey(now), cN=0, cSum=0, wSum=0, over=0, more=0, low=0, pN=0, nightN=0;
  for(var i=0;i<data.length;i++){
    var e = data[i];
    if(dayKey(e.t) !== tk) continue;
    if(e.k === 'c'){
      cN++; cSum += e.v;
      var av = assessVol(e.v);
      if(av.k === 'over') over++;
      else if(av.k === 'more') more++;
      else if(av.k === 'low') low++;
      if(isNight(e.t)) nightN++;
    }
    else if(e.k === 'p'){ pN++; }
    else { wSum += e.v; }
  }
  var line;
  if(cN === 0 && wSum === 0 && pN === 0){ line = '<span style="color:#94a3b8">今日还没有记录</span>'; }
  else{
    line = '<div class="tsum">'+
      '<span class="it">导尿 <b>'+cN+'</b> 次 · <b>'+cSum+'</b> ml'+(nightN ? '（夜'+nightN+'）' : '')+'</span>'+
      '<span class="it">水分 <b>'+wSum+'</b> ml</span>'+
      (pN > 0 ? '<span class="it">排便 <b>'+pN+'</b> 次</span>' : '')+
    '</div>';
    var L = volLine();
    if(over > 0) line += '<br><span class="over">⚠ 有 '+over+' 次超量（&gt;'+L.hard+' ml）</span>';
    else if(more > 0) line += '<br><span class="moretxt">有 '+more+' 次偏多（&gt;'+L.high+' ml）</span>';
    if(low > 0 && low === cN) line += '<br><span class="lowtxt">今天每次量都偏少（&lt;'+L.low+' ml）</span>';
  }
  document.getElementById('todayLine').innerHTML = line;
}

/* ====== 记录列表：月 → 日 两层折叠，时间/事件/数量三列 ====== */
var curFilter = UI.filter || 'all';   /* all | c | w */

/* 折叠的当前状态：显式 0/1 优先，否则走默认规则（当月/今天展开） */
function mClosedNow(mk){
  var v = UI.cm[mk];
  if(v === 0) return false;
  if(v === 1) return true;
  return mk !== monthKey(Date.now());
}
function dClosedNow(k){
  var v = UI.cd[k];
  if(v === 0) return false;
  if(v === 1) return true;
  return k !== dayKey(Date.now());
}
function toggleMonth(mk){
  UI.cm[mk] = mClosedNow(mk) ? 0 : 1;
  uiSave();
  renderList();
}
function toggleDay(k){
  UI.cd[k] = dClosedNow(k) ? 0 : 1;
  uiSave();
  renderList();
}

function renderList(){
  var box = document.getElementById('list');
  if(data.length === 0){
    box.innerHTML = '<div class="empty">还没有记录</div>';
    return;
  }

  /* 渲染用的数据集：按筛选过滤（间隔仍基于全部记录算，才不断链） */
  var show = data.filter(function(e){
    if(curFilter === 'c') return e.k === 'c' || e.k === 'p';
    if(curFilter === 'w') return e.k === 'w';
    return true;
  });

  if(show.length === 0){
    box.innerHTML = '<div class="fempty">这期间没有'+(curFilter==='c'?'导尿':'饮水')+'记录</div>';
    return;
  }

  /* 间隔 / 区间饮水 / 上一条导尿时刻：对完整数据算，不受筛选影响 */
  var gapMap = {}, waterMap = {}, prevTMap = {};
  var prevC = null, prevW = null, wRun = 0, p, en;
  for(p=0;p<data.length;p++){
    en = data[p];
    if(en.k === 'w'){
      if(prevW) gapMap[en.id] = en.t - prevW.t;
      prevW = en;
      wRun += en.v;
    }else if(en.k === 'c'){
      if(prevC){
        gapMap[en.id]   = en.t - prevC.t;
        waterMap[en.id] = wRun;
        prevTMap[en.id] = prevC.t;
      }
      prevC = en;
      wRun = 0;                 /* 下一条导尿只看这之后的饮水 */
    }
  }

  /* 分组：月 → 日（新→旧） */
  var months = [], curM = null, curD = null;
  for(var i=0;i<show.length;i++){
    var e2 = show[i], mk = monthKey(e2.t), dk = dayKey(e2.t);
    if(!curM || curM.mk !== mk){
      curM = {mk:mk, days:[], cN:0, cSum:0, wSum:0, pN:0};
      months.unshift(curM);
      curD = null;
    }
    if(!curD || curD.k !== dk){
      curD = {k:dk, items:[], cN:0, cSum:0, wSum:0, pN:0};
      curM.days.unshift(curD);
    }
    curD.items.push(e2);
    if(e2.k === 'c'){ curD.cN++; curD.cSum += e2.v; curM.cN++; curM.cSum += e2.v; }
    else if(e2.k === 'p'){ curD.pN++; curM.pN++; }
    else { curD.wSum += e2.v; curM.wSum += e2.v; }
  }

  var limit = UI.months || 6;
  var html = '';

  for(var m=0;m<months.length && m<limit;m++){
    var M = months[m];
    var mp = [];
    if(M.cN) mp.push('导尿'+M.cN+'次 '+M.cSum+'ml');
    if(M.wSum) mp.push('饮水'+M.wSum+'ml');
    if(M.pN) mp.push('便'+M.pN);
    mp.push(M.days.length+'天');

    html += '<div class="mh'+(mClosedNow(M.mk)?' closed':'')+'" data-month="'+M.mk+'">'+
              '<span class="mf"><span class="mcaret">▼</span>'+monthLabel(M.mk)+'</span>'+
              '<span class="mnum">'+mp.join(' · ')+'</span>'+
            '</div><div class="mbody">';

    for(var d=0;d<M.days.length;d++){
      var D = M.days[d];
      var parts = [];
      if(D.cN) parts.push('导尿'+D.cN+'次 '+D.cSum+'ml');
      if(D.wSum) parts.push('饮水'+D.wSum+'ml');
      if(D.pN) parts.push('便'+D.pN);

      html += '<div class="dh'+(dClosedNow(D.k)?' closed':'')+'" data-day="'+D.k+'">'+
                '<span class="dt"><span class="caret">▼</span>'+dayLabel(D.items[0].t)+'</span>'+
                '<span class="sum">'+(parts.join(' · ')||'无记录')+'</span>'+
              '</div><div class="day-body">';

      var runW = 0;
      for(var q=0;q<D.items.length;q++){
        var e3 = D.items[q];
        if(e3.k === 'w'){ runW += e3.v; html += rowWater(e3, gapMap[e3.id], runW); }
        else if(e3.k === 'p'){ html += rowPoo(e3); }
        else { html += rowCath(e3, gapMap[e3.id], waterMap[e3.id], prevTMap[e3.id]); }
      }

      html += '</div>';
    }

    html += '</div>';
  }

  if(months.length > limit){
    html += '<button class="loadmore" id="btnLoadMore" type="button">加载更早的记录（还有 '+
            (months.length - limit)+' 个月）</button>';
  }

  box.innerHTML = html;
}

function rowCath(e, gapMs, waterMl, prevT){
  var av = assessVol(e.v);
  var night = isNight(e.t) ? '<span class="nightmark">夜</span>' : '';

  var sub = [];
  if(gapMs != null){
    /* 跳过判定的情况：
       ① 本条或上一条落在夜间时段
       ② 跨天（隔夜那泡，每天早上一概不该报红）
       ③ 间隔 ≥24h（多半是漏记或中途停用）*/
    var skip = isNight(e.t) || (prevT != null && isNight(prevT)) ||
               (prevT != null && dayKey(prevT) !== dayKey(e.t)) ||
               gapMs >= 24*3600000;
    var ag = skip ? {k:'', t:''} : assessGap(gapMs);
    var cls = ag.k === 'over' ? ' bad' : (ag.k === 'long' || ag.k === 'short' ? ' hot' : '');
    sub.push('<span class="it'+cls+'">间隔 '+fmtGap(gapMs)+(ag.t?' · '+ag.t:'')+'</span>');
  }
  if(waterMl != null){
    sub.push('<span class="it">期间饮水 '+waterMl+'ml</span>');
  }

  return '<div class="tr ev-c'+(av.k==='over'?' over':'')+'" data-edit="'+e.id+'">'+
      '<span class="c1">'+night+hm(e.t)+'</span>'+
      '<span class="c2">导尿</span>'+
      '<span class="c3">'+e.v+'<span class="u">ml</span>'+
        (av.t ? '<span class="warnmark '+av.k+'">'+av.t+'</span>' : '')+
        '<button class="x" data-del="'+e.id+'">×</button>'+
      '</span>'+
      (sub.length ? '<span class="sub">'+sub.join('')+'</span>' : '')+
    '</div>';
}

function rowWater(e, gapMs, daySum){
  var j = jOf(e);
  /* 事件列已经写明“喝汤/喝粥”，不再重复加小标签 */
  var night = isNight(e.t) ? '<span class="nightmark">夜</span>' : '';

  var sub = [];
  if(gapMs != null) sub.push('<span class="it">间隔 '+fmtGap(gapMs)+'</span>');
  if(daySum != null) sub.push('<span class="it ok">当日 '+daySum+'ml</span>');

  return '<div class="tr ev-w" data-edit="'+e.id+'">'+
      '<span class="c1">'+night+hm(e.t)+'</span>'+
      '<span class="c2">'+JLIST[j]+'</span>'+
      '<span class="c3">'+e.v+'<span class="u">ml</span>'+
        '<button class="x" data-del="'+e.id+'">×</button>'+
      '</span>'+
      (sub.length ? '<span class="sub">'+sub.join('')+'</span>' : '')+
    '</div>';
}

/* 排便：只记时间，数量列留空 */
function rowPoo(e){
  var night = isNight(e.t) ? '<span class="nightmark">夜</span>' : '';
  return '<div class="tr ev-p poo" data-edit="'+e.id+'">'+
      '<span class="c1">'+night+hm(e.t)+'</span>'+
      '<span class="c2">排便</span>'+
      '<span class="c3"><button class="x" data-del="'+e.id+'">×</button></span>'+
    '</div>';
}

function renderAll(){ renderStatus(); renderList(); }

/* ====== 新增 / 删除 / 撤销 ====== */
function addEntry(kind, ml, ts, j){
  var o = {
    id: String(ts) + Math.random().toString(36).slice(2,7),
    t: ts,
    k: kind,
    v: ml
  };
  if(kind === 'w' && j && j !== 'w') o.j = j;
  data.push(o);
  data.sort(function(a,b){ return a.t - b.t; });
  save();
  renderAll();
  buzz();
  return o;
}

function findEntry(id){
  for(var i=0;i<data.length;i++){ if(data[i].id === id) return data[i]; }
  return null;
}

/* 删除后 5 秒内可撤销，代替确认弹窗 */
function delEntry(id){
  var e = findEntry(id);
  if(!e) return;
  data = data.filter(function(x){ return x.id !== id; });
  save();
  renderAll();
  toast('已删除 ' + hm(e.t) + ' 这条记录', false, function(){
    data.push(e);
    data.sort(function(a,b){ return a.t - b.t; });
    save();
    renderAll();
    toast('已恢复');
  });
}

/* ====== 滚轮选择器 ====== */
var picker = { wrap:null, values:[], idx:0, timer:null };

function buildPicker(isCath, initVal){
  var wrap = document.getElementById('pwrap');
  wrap.innerHTML = '';
  var step = isCath ? CFG.STEP_CATH : CFG.STEP_WATER;
  var min  = isCath ? CFG.MIN_CATH  : CFG.MIN_WATER;
  var max  = isCath ? CFG.MAX_CATH  : CFG.MAX_WATER;

  var vals = [];
  for(var v=min; v<=max; v+=step){ vals.push(v); }
  picker.values = vals;
  picker.wrap = wrap;
  picker.step = step;

  vals.forEach(function(v){
    var d = document.createElement('div');
    d.className = 'pitem';
    d.textContent = v;
    d.dataset.v = v;
    wrap.appendChild(d);
  });

  /* 上下各垫一个空行，使首尾能对齐中线 */
  var pad1 = document.createElement('div'); pad1.className = 'pitem'; pad1.style.height='44px'; pad1.style.visibility='hidden';
  var pad2 = document.createElement('div'); pad2.className = 'pitem'; pad2.style.height='44px'; pad2.style.visibility='hidden';
  wrap.insertBefore(pad1, wrap.firstChild);
  wrap.appendChild(pad2);

  var i = vals.indexOf(initVal);
  if(i < 0) i = Math.min(vals.length-1, Math.max(0, Math.round((initVal-min)/step)));
  picker.idx = i;

  wrap.onscroll = function(){
    clearTimeout(picker.timer);
    picker.timer = setTimeout(function(){ snapPicker(); }, 90);
  };

  /* 点击某行直接选中 */
  wrap.onclick = function(ev){
    var t = ev.target;
    if(!t || !t.dataset || !t.dataset.v) return;
    var k = vals.indexOf(parseInt(t.dataset.v,10));
    if(k >= 0) scrollToIdx(k, true);
  };
}

function scrollToIdx(i, smooth){
  var wrap = picker.wrap;
  if(!wrap) return;
  picker.idx = i;
  wrap.scrollTo({ top: i*44, behavior: smooth ? 'smooth' : 'auto' });
  setTimeout(markPicker, smooth ? 220 : 0);
}

function snapPicker(){
  var wrap = picker.wrap;
  if(!wrap) return;
  var i = Math.round(wrap.scrollTop / 44);
  i = Math.max(0, Math.min(picker.values.length-1, i));
  picker.idx = i;
  if(Math.abs(wrap.scrollTop - i*44) > 1){
    wrap.scrollTo({ top: i*44, behavior:'smooth' });
  }
  markPicker();
}

function markPicker(){
  var wrap = picker.wrap;
  if(!wrap) return;
  var items = wrap.querySelectorAll('.pitem[data-v]');
  for(var i=0;i<items.length;i++){
    var on = i === picker.idx;
    items[i].className = 'pitem' + (on ? ' sel' : '') + (on && picker.values[i] > volLine().hard && sheetKind==='c' ? ' over' : '');
  }
}

function pickerValue(){
  return picker.values[picker.idx] || CFG.DEF_CATH;
}

/* ====== 底部弹层（新增 / 编辑共用） ====== */
var sheetKind = null;
var sheetJ = 'w';
var editId = null;

function nowTimeValue(){
  var d = new Date();
  return p2(d.getHours())+':'+p2(d.getMinutes());
}
function dateValue(ts){
  var d = new Date(ts);
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
}

/* 读日期 + 时间。null = 没填好，-1 = 晚于现在 */
function readWhen(){
  var dv = document.getElementById('dt').value || '';
  var tv = document.getElementById('tm').value || '';
  var p = dv.split('-'), q = tv.split(':');
  if(p.length !== 3 || q.length !== 2) return null;
  var d = new Date(+p[0], +p[1]-1, +p[2], +q[0], +q[1], 0, 0);
  var t = d.getTime();
  if(isNaN(t)) return null;
  if(t > Date.now() + 60000) return -1;
  return t;
}

function openSheet(kind, j, entry){
  sheetKind = kind;
  editId = entry ? entry.id : null;
  var isC = kind === 'c';
  var isP = kind === 'p';
  sheetJ = entry && entry.k === 'w' ? jOf(entry) : (j || 'w');

  document.getElementById('sheetTitle').textContent =
    editId ? (isP ? '编辑排便' : '编辑记录') : (isC ? '记录导尿' : '记录水分');

  /* 水分类型选择：仅水分时显示 */
  var jrow = document.getElementById('jrow');
  jrow.style.display = (!isC && !isP) ? 'grid' : 'none';
  Array.prototype.forEach.call(jrow.querySelectorAll('[data-j]'), function(b){
    b.className = 'chipbtn' + (b.getAttribute('data-j') === sheetJ ? ' on' : '');
  });

  var hint = '';
  if(editId){
    hint = '改完点「保存」；也可以在下面直接删除';
  }else if(isC){
    var lc = lastCath();
    hint = lc ? '距上次导尿 ' + fmtDur(Date.now()-lc.t) : '这是第一条导尿记录';
  }else{
    var lw = lastWater();
    var tk = dayKey(Date.now()), s = 0;
    data.forEach(function(e){ if(e.k==='w' && dayKey(e.t)===tk) s += e.v; });
    hint = (lw ? '距上次摄入 ' + fmtDur(Date.now()-lw.t) + '　·　' : '') + '今日已摄入 ' + s + ' ml';
  }
  document.getElementById('sheetHint').textContent = hint;

  /* 数值区：排便只改时间 */
  document.getElementById('pickerBox').style.display = isP ? 'none' : 'flex';
  var chips = document.getElementById('chips');
  chips.style.display = isP ? 'none' : 'grid';
  chips.innerHTML = '';

  if(!isP){
    var presets = isC ? [100,130,150,180] : [50,100,150,200];
    presets.forEach(function(v){
      var b = document.createElement('button');
      b.className = 'chipbtn';
      b.type = 'button';
      b.textContent = v;
      b.onclick = function(){ setPicker(v); };
      chips.appendChild(b);
    });
    buildPicker(isC, entry ? entry.v : (isC ? CFG.DEF_CATH : CFG.DEF_WATER));
  }

  document.getElementById('dt').value = entry ? dateValue(entry.t) : dateValue(Date.now());
  document.getElementById('tm').value = entry ? hm(entry.t) : nowTimeValue();

  /* 只有编辑模式才出现「删除」 */
  document.getElementById('sheetDel').style.display = editId ? 'block' : 'none';
  document.getElementById('sheetActions').className = 'sheet-actions' + (editId ? ' edit' : '');

  document.getElementById('mask').className = 'mask open';
  document.getElementById('sheet').className = 'sheet open';

  if(!isP){
    setTimeout(function(){
      scrollToIdx(picker.idx, false);
      markPicker();
    }, 40);
  }
}

function setPicker(val){
  var i = picker.values.indexOf(val);
  if(i < 0){
    var min = picker.values[0] || 0;
    i = Math.min(picker.values.length-1, Math.max(0, Math.round((val-min)/(picker.step||1))));
  }
  scrollToIdx(i, true);
}

function closeSheet(){
  document.getElementById('mask').className = 'mask';
  document.getElementById('sheet').className = 'sheet';
  sheetKind = null;
  editId = null;
  try{ document.activeElement.blur(); }catch(e){}
}

function confirmSheet(){
  if(!sheetKind) return;
  var kind = sheetKind;

  var ts = readWhen();
  if(ts === null){ toast('请选择日期和时间', true); return; }
  if(ts === -1){ toast('时间不能晚于现在', true); return; }

  var v = 0;
  if(kind !== 'p'){
    v = pickerValue();
    if(!v || v <= 0){ toast('请选择数值', true); return; }
  }

  /* 编辑已有记录 */
  if(editId){
    var e = findEntry(editId);
    if(e){
      e.t = ts;
      if(kind !== 'p') e.v = v;
      if(e.k === 'w'){
        if(sheetJ === 's' || sheetJ === 'p') e.j = sheetJ;
        else delete e.j;
      }
      data.sort(function(a,b){ return a.t - b.t; });
      save();
      renderAll();
      buzz();
      toast('已修改');
    }
    closeSheet();
    return;
  }

  /* 新增 */
  var j = sheetJ;
  var rec = addEntry(kind, v, ts, j);
  closeSheet();

  var undo = function(){
    data = data.filter(function(x){ return x.id !== rec.id; });
    save();
    renderAll();
    toast('已撤销');
  };

  if(kind === 'c'){
    var av = assessVol(v), L = volLine();
    var msg = '已记录导尿 ' + v + ' ml';
    if(av.k === 'over')      msg += '，超量（上限 '+L.hard+' ml）';
    else if(av.k === 'more') msg += '，偏多（上限 '+L.high+' ml）';
    else if(av.k === 'low')  msg += '，偏少';
    toast(msg, av.k === 'over', undo);
  }else{
    toast('已记录' + JLIST[j] + ' ' + v + ' ml', false, undo);
  }
}

/* CSV 单元格转义：含逗号/双引号/换行时用双引号包起来（RFC 4180） */
function csvCell(v){
  var s = (v === null || v === undefined) ? '' : String(v);
  if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

/* CSV 行必须用 CRLF；单元格统一走 csvCell */
function csvRow(cells){
  return cells.map(csvCell).join(',');
}

/* ====== 导出 CSV ======
   列：日期 / 时间 / 事件 / 量 / 间隔(分) / 期间饮水 / 当日累计饮水 */
function buildCsv(){
  var rows = [['日期','时间','事件','量(ml)','间隔(分钟)','期间饮水(ml)','当日累计饮水(ml)']];
  var prevC = null, prevW = null, wRun = 0;
  var dayK = '', dayW = 0;

  data.forEach(function(e){
    var dk = dayKey(e.t);
    if(dk !== dayK){ dayK = dk; dayW = 0; }

    var gap = '', between = '', daySum = '';
    if(e.k === 'c'){
      if(prevC){
        gap = Math.round((e.t - prevC.t)/60000);
        between = wRun;
      }
      prevC = e;
      wRun = 0;
    }else if(e.k === 'w'){
      if(prevW) gap = Math.round((e.t - prevW.t)/60000);
      prevW = e;
      wRun += e.v;
      dayW += e.v;
      daySum = dayW;
    }

    var name = e.k === 'c' ? '导尿' : (e.k === 'p' ? '排便' : JLIST[jOf(e)]);
    rows.push([ dk, hm(e.t), name, e.k === 'p' ? '' : e.v, gap, between, daySum ]);
  });
  return '\ufeff' + rows.map(csvRow).join('\r\n');
}

/* 是否运行在 APK 内部（由原生注入 AndroidBridge） */
function nativeBridge(){
  try{
    if(window.AndroidBridge && window.AndroidBridge.hasNative && window.AndroidBridge.hasNative()){
      return window.AndroidBridge;
    }
  }catch(e){}
  return null;
}

/* UTF-8 字符串 -> Base64 */
function toBase64(str){
  var bytes = new TextEncoder().encode(str);
  var bin = '';
  for(var i=0;i<bytes.length;i++){ bin += String.fromCharCode(bytes[i]); }
  return btoa(bin);
}

/* 保存文本：APK 内交给原生写文件，浏览器走 Blob 下载 */
function saveText(name, mime, text){
  var nb = nativeBridge();
  if(nb){
    try{
      var b64 = toBase64(text);
      var ok = nb.saveFile ? nb.saveFile(name, mime, b64) : nb.saveCsv(name, b64);
      return !!ok;
    }catch(e){ return false; }
  }
  try{
    var blob = new Blob([text], {type: mime + ';charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    return true;
  }catch(e){ return false; }
}

/* 文件名时间戳：带秒，避免同一分钟内备份互相覆盖 */
function stamp(){
  var d = new Date();
  return dayKey(d.getTime()) + '_' + p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds());
}

function exportCsv(){
  if(data.length === 0){ toast('还没有数据可以导出'); return; }
  var name = '导尿记录_' + stamp() + '.csv';
  if(saveText(name, 'text/csv', buildCsv())) toast('已导出 CSV：' + name);
  else toast('导出失败，请重试', true);
}

/* ====== 备份 / 恢复 ====== */
function buildBackup(){
  return JSON.stringify({
    app: 'daoniao',
    version: 2,
    exportedAt: Date.now(),
    count: data.length,
    records: data
  }, null, 1);
}

/* 兼容两种文件：本 App 的备份对象，或一个裸数组 */
function parseBackup(text){
  var o;
  try{ o = JSON.parse(text); }catch(e){ return null; }
  var arr = Array.isArray(o) ? o : (o && Array.isArray(o.records) ? o.records : null);
  if(!arr) return null;
  var out = [], i;
  for(i=0;i<arr.length;i++){
    var e = arr[i];
    if(!e || typeof e.t !== 'number' || (e.k !== 'c' && e.k !== 'w' && e.k !== 'p')) continue;
    var r = {
      id: e.id ? String(e.id) : (String(e.t) + Math.random().toString(36).slice(2,7)),
      t: e.t,
      k: e.k,
      v: (typeof e.v === 'number' && isFinite(e.v)) ? e.v : 0
    };
    if(e.k === 'w' && (e.j === 's' || e.j === 'p')) r.j = e.j;
    out.push(r);
  }
  return out.length ? out : null;
}

function exportJson(quiet){
  if(data.length === 0){ if(!quiet) toast('还没有数据'); return false; }
  var name = '导尿记录_备份_' + stamp() + '.json';
  var text = buildBackup();
  var done = false;

  /* APK 内：存到 App 内部目录 + 「下载/导尿记录」各一份，恢复时能直接列出 */
  var nb = nativeBridge();
  if(nb && nb.saveBackup){
    try{
      var fn = (quiet && nb.saveBackupQuiet) ? nb.saveBackupQuiet : nb.saveBackup;
      if(fn.call(nb, name, toBase64(text))){
        done = true;
        if(!quiet) toast('已备份 ' + data.length + ' 条：' + name);
      }
    }catch(e){}
  }

  if(!done){
    done = saveText(name, 'application/json', text);
    if(done){ if(!quiet) toast('已备份 ' + data.length + ' 条：' + name); }
    else if(!quiet){ toast('备份失败，请重试', true); }
  }

  if(done){ UI.lastBackup = Date.now(); uiSave(); renderBackInfo(); }
  return done;
}

/* 上次备份时间（页脚显示，不占地方） */
function renderBackInfo(){
  var el = document.getElementById('backInfo');
  if(!el) return;
  var nb = nativeBridge();
  var target = nb ? 'App 内 + 下载/导尿记录/' : '浏览器下载';
  if(!UI.lastBackup){
    el.innerHTML = '还没有备份 · 备份会存到 ' + target;
    return;
  }
  var d = new Date(UI.lastBackup);
  var tk = dayKey(Date.now());
  var t = hm(UI.lastBackup);
  var when = dayKey(UI.lastBackup) === tk ? '今天 ' + t
           : (dayKey(UI.lastBackup) === dayKey(Date.now()-86400000) ? '昨天 ' + t
           : (d.getMonth()+1) + '月' + d.getDate() + '日 ' + t);
  el.innerHTML = '上次备份 ' + when + ' · 存在 ' + target;
}

/* 每天自动备份一次（仅 APK），不弹提示 */
function autoBackup(){
  var nb = nativeBridge();
  if(!nb || !nb.saveBackup) return;
  if(data.length === 0) return;
  var today = dayKey(Date.now());
  if(UI.lastBackup && dayKey(UI.lastBackup) === today) return;
  exportJson(true);
}

/* ====== 恢复：APK 内直接列出内部备份 ====== */
function openRestore(){
  var nb = nativeBridge();
  if(nb && nb.listBackups){
    var list = [];
    try{ list = JSON.parse(nb.listBackups() || '[]'); }catch(e){ list = []; }

    if(!list.length){
      /* 没有内部备份 → 退回系统文件选择器 */
      pickFile();
      return;
    }

    var box = document.getElementById('rlist');
    var html = '';
    list.forEach(function(it){
      var d = new Date(it.time);
      var when = d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+
                 ' '+p2(d.getHours())+':'+p2(d.getMinutes());
      var kb = (it.size/1024).toFixed(1);
      html += '<div class="ritem" data-name="'+it.name+'">'+
                '<div class="rmain"><span class="rn">'+when+'</span>'+
                '<span class="rs">'+kb+' KB</span></div>'+
                '<button class="rx" data-rdel="'+it.name+'" type="button">删除</button>'+
              '</div>';
    });
    box.innerHTML = html;

    document.getElementById('maskR').className = 'mask open';
    document.getElementById('sheetR').className = 'sheet open';
    return;
  }

  pickFile();
}

/* 系统文件选择器（浏览器，或 APK 内无内部备份时） */
function pickFile(){
  var fi = document.getElementById('fileIn');
  /* 放宽 accept：部分安卓文件管理器会把 json 当未知类型隐起来 */
  fi.removeAttribute('accept');
  fi.click();
}

function closeRestore(){
  document.getElementById('maskR').className = 'mask';
  document.getElementById('sheetR').className = 'sheet';
}

function restoreFromNative(name){
  var nb = nativeBridge();
  if(!nb || !nb.readBackup){ return; }
  var txt = '';
  try{ txt = nb.readBackup(name) || ''; }catch(e){ txt = ''; }
  if(!txt){ toast('读不到这份备份', true); return; }
  closeRestore();
  doRestore(txt);
}

function doRestore(text){
  var arr = parseBackup(text);
  if(!arr){ toast('这个文件不是备份文件', true); return; }
  if(!confirm('备份里有 ' + arr.length + ' 条记录，会替换当前的 ' + data.length + ' 条。\n先备份当前数据一份，再继续？')) return;
  exportJson(true);
  data = arr;
  data.sort(function(a,b){ return a.t - b.t; });
  save();
  renderAll();
  toast('已恢复 ' + arr.length + ' 条记录');
}

/* 新增后 5 秒内可撤销 */
function undoAdd(rec){
  return function(){
    data = data.filter(function(x){ return x.id !== rec.id; });
    save();
    renderAll();
    toast('已撤销');
  };
}

/* ====== 复诊简报：一页文字摘要（关键数字加粗） ====== */
var repDays = 7;

function repPretty(k){ var p=k.split('-'); return (parseInt(p[1],10))+'月'+(parseInt(p[2],10))+'日'; }

function repLine(k, v){
  return '<div class="line"><span>'+k+'</span><span>'+v+'</span></div>';
}

/* 汇总统计：返回对象，html/text 由它生成 */
function repStats(days){
  var now = Date.now();
  var d0 = new Date(); d0.setHours(0,0,0,0);
  /* 按自然日对齐：近 7 天 = 今天 + 前 6 天，和标题区间一致 */
  var from = days > 0 ? d0.getTime() - (days-1)*86400000 : 0;
  var cs = [], ws = [], pN = 0, i, e;
  for(i=0;i<data.length;i++){
    e = data[i];
    if(e.t < from) continue;
    if(e.k === 'c') cs.push(e);
    else if(e.k === 'w') ws.push(e);
    else pN++;
  }

  var spanDays = days > 0 ? days : (cs.length ? Math.max(1, Math.ceil((now - startOfDay(cs[0].t))/86400000)) : 1);

  var L = volLine();
  var sum = 0, mx = 0, mn = 0, over = 0, more = 0, low = 0, nightN = 0;
  var gaps = [], overGap = 0;
  for(i=0;i<cs.length;i++){
    var v = cs[i].v;
    sum += v;
    if(v > mx){ mx = v; }
    if(mn === 0 || v < mn){ mn = v; }
    var av = assessVol(v);
    if(av.k === 'over') over++; else if(av.k === 'more') more++; else if(av.k === 'low') low++;
    if(isNight(cs[i].t)) nightN++;
    if(i > 0){
      var g = cs[i].t - cs[i-1].t;
      if(!isNight(cs[i].t) && !isNight(cs[i-1].t)){
        if(g > 10*60000) gaps.push(g);
        if(g > CFG.GAP_OVER*3600000) overGap++;
      }
    }
  }
  var wSum = 0;
  for(i=0;i<ws.length;i++) wSum += ws[i].v;

  var gapSum = 0, gapMax = 0;
  for(i=0;i<gaps.length;i++){ gapSum += gaps[i]; if(gaps[i] > gapMax) gapMax = gaps[i]; }

  var maxT = 0;
  for(i=0;i<cs.length;i++){ if(cs[i].v === mx){ maxT = cs[i].t; break; } }

  return {
    n: cs.length, spanDays: spanDays, from: from, to: now,
    perDay: cs.length/spanDays,
    sum: sum, avg: cs.length ? Math.round(sum/cs.length) : 0, mx: mx, mn: mn, maxT: maxT,
    over: over, more: more, low: low, nightN: nightN,
    gapAvg: gaps.length ? gapSum/gaps.length : 0, gapMax: gapMax, gapN: gaps.length, overGap: overGap,
    wSum: wSum, wPerDay: Math.round(wSum/spanDays), pN: pN,
    L: L, wsN: ws.length
  };
}

function buildReport(days){
  var s = repStats(days);
  if(s.n === 0 && s.wSum === 0 && s.pN === 0){
    return { html: '<div class="dim">这段时间还没有记录</div>', text: '这段时间还没有记录' };
  }

  var startTs = s.from > 0 ? s.from
      : (s.n || s.wsN ? startOfDay(earliestTs()) : startOfDay(Date.now()));
  var rng = repPretty(dayKey(startTs)) + ' – ' + repPretty(dayKey(s.to)) + '，共 ' + s.spanDays + ' 天';

  var h = '', t = [];
  h += '<h4>概况</h4>';
  h += repLine('统计区间', rng);
  t.push('统计区间：' + rng);

  h += repLine('导尿次数', '共 <b>'+s.n+'</b> 次，日均 <b>'+s.perDay.toFixed(1)+'</b> 次');
  t.push('导尿：共 ' + s.n + ' 次，日均 ' + s.perDay.toFixed(1) + ' 次');

  h += repLine('单次尿量', '平均 <b>'+s.avg+'</b> ml，最多 <b>'+s.mx+'</b> ml' +
      (s.maxT ? '<span class="dim">（'+repPretty(dayKey(s.maxT))+' '+hm(s.maxT)+'）</span>' : '') +
      '，最少 <b>'+s.mn+'</b> ml');
  t.push('单次尿量：平均 ' + s.avg + ' ml，最多 ' + s.mx + ' ml，最少 ' + s.mn + ' ml');

  h += repLine('水分摄入', '共 <b>'+s.wSum+'</b> ml，日均 <b>'+s.wPerDay+'</b> ml');
  t.push('水分摄入：共 ' + s.wSum + ' ml，日均 ' + s.wPerDay + ' ml');

  h += repLine('排便', '<b>'+s.pN+'</b> 次');
  t.push('排便：' + s.pN + ' 次');

  h += '<h4>间隔（仅白天）</h4>';
  if(s.gapN){
    h += repLine('平均间隔', '<b>'+fmtGap(s.gapAvg)+'</b>，最长 <b>'+fmtGap(s.gapMax)+'</b>');
    t.push('白天间隔：平均 ' + fmtGap(s.gapAvg) + '，最长 ' + fmtGap(s.gapMax));
  }else{
    h += repLine('平均间隔', '<span class="dim">样本不足</span>');
    t.push('白天间隔：样本不足');
  }
  h += repLine('夜间导尿', '<b>'+s.nightN+'</b> 次（'+CFG.NIGHT_S+'点–'+CFG.NIGHT_E+'点）');
  t.push('夜间导尿：' + s.nightN + ' 次（' + CFG.NIGHT_S + '点–' + CFG.NIGHT_E + '点）');

  h += '<h4>需要关注</h4>';
  var flags = [];
  if(s.over)    flags.push('<b class="warn">超量</b>（&gt;'+s.L.hard+'ml）<b class="warn">'+s.over+'</b> 次');
  if(s.more)    flags.push('<b>偏多</b>（&gt;'+s.L.high+'ml）<b>'+s.more+'</b> 次');
  if(s.low)     flags.push('<b>偏少</b>（&lt;'+s.L.low+'ml）<b>'+s.low+'</b> 次');
  if(s.overGap) flags.push('<b class="warn">白天间隔过长</b>（&gt;'+CFG.GAP_OVER+'h）<b class="warn">'+s.overGap+'</b> 次');
  if(!flags.length){
    h += repLine('尿量', '<span class="ok">无超量/偏多</span>');
    t.push('需要关注：无超量/偏多');
  }else{
    for(var i=0;i<flags.length;i++) h += '<div class="flag"><i>•</i><span>'+flags[i]+'</span></div>';
    t.push('需要关注：' + flags.map(function(x){ return x.replace(/<[^>]+>/g,''); }).join('；'));
  }

  h += '<h4>参考值</h4>';
  h += repLine('预计膀胱容量', '<b>'+ebcMl()+'</b> ml（按 '+ageYears()+' 岁估算）');
  h += repLine('合理单次', '<b>'+s.L.low+'–'+s.L.high+'</b> ml');
  t.push('预计膀胱容量 ' + ebcMl() + ' ml（' + ageYears() + ' 岁），合理单次 ' + s.L.low + '–' + s.L.high + ' ml');

  t.unshift('【导尿记录摘要】');
  return { html: h, text: t.join('\n') };
}

function renderReport(){
  var r = buildReport(repDays);
  document.getElementById('repBody').innerHTML = r.html;
  document.getElementById('repBody').setAttribute('data-text', r.text);
}

function openReport(){
  repDays = 7;
  Array.prototype.forEach.call(document.querySelectorAll('#segRep [data-r]'), function(b){
    b.className = (parseInt(b.getAttribute('data-r'),10) === repDays) ? 'on' : '';
  });
  renderReport();
  document.getElementById('maskS').className = 'mask open';
  document.getElementById('sheetS').className = 'sheet open';
}
function closeReport(){
  document.getElementById('maskS').className = 'mask';
  document.getElementById('sheetS').className = 'sheet';
}

function copyText(txt){
  var done = function(){ toast('已复制，可直接粘贴给医生'); };
  var fail = function(){ toast('复制失败，请长按选中文字', true); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, fail);
      return;
    }
  }catch(e){}
  try{
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = document.execCommand('copy');
    ta.remove();
    ok ? done() : fail();
  }catch(e){ fail(); }
}

/* ====== 设置 ====== */
function backTimeText(ts){
  if(!ts) return '—';
  var d = new Date(ts), tk = dayKey(Date.now());
  var t = hm(ts);
  if(dayKey(ts) === tk) return '今天 ' + t;
  if(dayKey(ts) === dayKey(Date.now()-86400000)) return '昨天 ' + t;
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+t;
}

/* ====== 长按水量键 → 选水/汤/粥 ====== */
var qm = { v:0, timer:null, at:0 };

function openQmenu(v){
  qm.v = v;
  document.getElementById('qmTitle').textContent = '记 ' + v + ' ml 为';
  document.getElementById('qmenu').className = 'qmenu open';
  clearTimeout(qm.timer);
  qm.timer = setTimeout(closeQmenu, 4500);
}
function closeQmenu(){
  document.getElementById('qmenu').className = 'qmenu';
  clearTimeout(qm.timer);
}

/* 滚轮 ±10 档 */
function stepPicker(n){
  var vals = picker.values;
  if(!vals || !vals.length) return;
  var step = picker.step || 1;
  var i = picker.idx + Math.round(n/step);
  i = Math.max(0, Math.min(vals.length-1, i));
  scrollToIdx(i, true);
}

Array.prototype.forEach.call(document.querySelectorAll('[data-w]'), function(b){
  var v = parseInt(b.getAttribute('data-w'), 10);
  var timer = null;

  function record(j){
    var rec = addEntry('w', v, Date.now(), j);
    toast('已记录' + JLIST[j] + ' ' + v + ' ml', false, undoAdd(rec));
  }

  b.onclick = function(){
    /* 刚刚长按弹过菜单，这次 click 不算 */
    if(Date.now() - qm.at < 900) return;
    if(v === 0){ openSheet('w', 'w'); return; }
    record('w');
  };

  if(v === 0) return;   /* 「其他」不接长按 */

  function down(){
    qm.at = 0;
    clearTimeout(timer);
    timer = setTimeout(function(){
      qm.at = Date.now();
      buzz();
      openQmenu(v);
    }, 430);
  }
  function up(){ clearTimeout(timer); }

  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('pointerleave', up);
  b.addEventListener('contextmenu', function(e){ e.preventDefault(); });
});

/* 列表：点月/日折叠，点×删除（可撤销），点整行进编辑 */
document.getElementById('list').onclick = function(ev){
  var node = ev.target;

  /* 加载更早的月份 */
  if(node && node.id === 'btnLoadMore'){
    UI.months = (UI.months || 6) + 6;
    uiSave();
    renderList();
    return;
  }

  /* 月份头 */
  var mn = node;
  while(mn && mn !== this && !(mn.getAttribute && mn.getAttribute('data-month'))){ mn = mn.parentNode; }
  if(mn && mn !== this){ toggleMonth(mn.getAttribute('data-month')); return; }

  /* 日期头 */
  var dn = node;
  while(dn && dn !== this && !(dn.getAttribute && dn.getAttribute('data-day'))){ dn = dn.parentNode; }
  if(dn && dn !== this){ toggleDay(dn.getAttribute('data-day')); return; }

  while(node && node !== this &&
        !(node.getAttribute && (node.getAttribute('data-del') || node.getAttribute('data-edit')))){
    node = node.parentNode;
  }
  if(!node || node === this) return;

  var delId = node.getAttribute && node.getAttribute('data-del');
  if(delId){ delEntry(delId); return; }

  var id = node.getAttribute && node.getAttribute('data-edit');
  var e = id ? findEntry(id) : null;
  if(e) openSheet(e.k, jOf(e), e);
};

    if(nb && nb.deleteBackup){
      if(confirm('删除这份备份？')){
        nb.deleteBackup(delName);
        openRestore();
      }
    }
    return;
  }
  var n = t;
  while(n && n !== this && !(n.getAttribute && n.getAttribute('data-name'))){ n = n.parentNode; }
  if(n && n !== this){ restoreFromNative(n.getAttribute('data-name')); }
};

};
