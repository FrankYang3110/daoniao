<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>selftest</title>
<style>body{font:14px/1.6 monospace;padding:16px}pre{white-space:pre-wrap}.f{color:#b91c1c;font-weight:700}.p{color:#15803d}</style>
</head>
<body>
<h3>导尿记录 · 自测</h3>
<pre id="out">running…</pre>
<iframe id="f" src="../index.html" style="width:420px;height:900px;border:1px solid #ccc"></iframe>
<script>
var lines = [], fails = 0;
function ok(name, cond, extra){
  if(!cond) fails++;
  lines.push((cond ? 'PASS ' : 'FAIL ') + name + (cond || !extra ? '' : '  <' + extra + '>'));
}
function eq(name, a, b){ ok(name, a === b, JSON.stringify(a) + ' !== ' + JSON.stringify(b)); }
function near(name, a, b, tol){ ok(name, Math.abs(a - b) <= (tol || 1), a + ' vs ' + b); }

function run(w){
  var D = w.DN;
  /* 测试会触发一次 save()，结束前把真实数据放回去 */
  var saved = null, savedUI = null;
  try{ saved = w.localStorage.getItem('cathlog_v1'); }catch(e){}
  try{ savedUI = w.localStorage.getItem('cathlog_ui_v1'); }catch(e){}
  ok('DN 已注入', !!D);
  if(!D) return;

  /* --- median --- */
  eq('median 奇数个', D.median([1,2,3]), 2);
  eq('median 偶数个', D.median([1,2,3,4]), 2.5);
  eq('median 空数组', D.median([]), 0);

  /* --- 时间工具 --- */
  eq('fmtGap 3h28min', D.fmtGap(3*3600000 + 28*60000), '3h28min');
  eq('fmtGap 整点', D.fmtGap(2*3600000), '2h');
  eq('dayKey', D.dayKey(new Date(2026,9,17,13,5).getTime()), '2026-10-17');
  eq('dateValue', D.dateValue(new Date(2026,0,5,0,0).getTime()), '2026-01-05');
  eq('hm', D.hm(new Date(2026,0,5,9,7).getTime()), '09:07');

  /* --- 个人基线 --- */
  var now = Date.now();
  function mk(i, hoursAgo, ml){ return { id:'t'+i, t: now - hoursAgo*3600000, k:'c', v: ml }; }
  /* 7 条导尿，间隔 3 小时，量 150 */
  var arr = [];
  for(var i=0;i<7;i++) arr.push(mk(i, i*3, 150));
  D.setData(arr, true);
  var b = D.computeBaseline();
  ok('基线：样本够 → gapOK', b.gapOK);
  near('基线：中位间隔约 3h', b.gapMs, 3*3600000, 60000);
  eq('基线：中位量 150', b.volMed, 150);

  /* 只有 2 条 → 退回默认 3h */
  D.setData([mk(0,0,150), mk(1,3,150)], true);
  var b2 = D.computeBaseline();
  ok('基线：样本不足 → gapOK=false', !b2.gapOK);
  eq('基线：样本不足退回 3h', b2.gapMs, 3*3600000);

  /* 一个 20 小时的跨夜中断应被排除 */
  var arr3 = [mk(0,0,150), mk(1,3,150), mk(2,6,150), mk(3,9,150), mk(4,12,150), mk(5,15,150), mk(6,35,150)];
  D.setData(arr3, true);
  var b3 = D.computeBaseline();
  ok('基线：排除 >12h 的中断', b3.gapOK && Math.abs(b3.gapMs - 3*3600000) < 60000, b3.gapMs);

  /* --- 备份往返 --- */
  D.setData([mk(0,0,180), {id:'w1', t: now - 3600000, k:'w', v:100, j:'s'},
             {id:'p1', t: now - 7200000, k:'p', v:0}], true);
  var txt = D.buildBackup();
  var back = D.parseBackup(txt);
  ok('备份往返：条数一致', back && back.length === 3, back && back.length);
  var byK = {};
  (back || []).forEach(function(r){ byK[r.k] = r; });
  eq('备份往返：汤类型保留', byK.w && byK.w.j, 's');
  eq('备份往返：排便量 0', byK.p && byK.p.v, 0);
  eq('备份往返：导尿量 180', byK.c && byK.c.v, 180);
  ok('备份可被 JSON.parse', !!JSON.parse(txt).records);

  /* --- 备份容错 --- */
  eq('非 JSON 拒绝', D.parseBackup('hello'), null);
  eq('缺 records 拒绝', D.parseBackup('{"a":1}'), null);
  eq('脏记录被过滤', (D.parseBackup('[{"t":1,"k":"x"},{"t":2,"k":"c","v":100}]') || []).length, 1);
  ok('裸数组可导入', (D.parseBackup('[{"t":1700000000000,"k":"c","v":120}]') || []).length === 1);

  /* --- CSV --- */
  var csv = D.buildCsv();
  ok('CSV 有 BOM', csv.charCodeAt(0) === 0xFEFF);
  eq('CSV 表头', csv.split('\r\n')[0], '\ufeff日期,时间,事件,量(ml),间隔(分钟),期间饮水(ml),当日累计饮水(ml)');
  eq('CSV 行数 = 记录数+表头', csv.trim().split('\r\n').length, 4);
  eq('CSV 列数 = 7', csv.trim().split('\r\n')[0].split(',').length, 7);

  /* --- CSV 转义（RFC 4180） --- */
  eq('csvCell 普通', D.csvCell('导尿'), '导尿');
  eq('csvCell 数字', D.csvCell(150), '150');
  eq('csvCell 空值', D.csvCell(null), '');
  eq('csvCell 含逗号', D.csvCell('粥,加肉松'), '"粥,加肉松"');
  eq('csvCell 含双引号', D.csvCell('他说"好"'), '"他说""好"""');
  eq('csvCell 含换行', D.csvCell('a\nb'), '"a\nb"');
  eq('csvRow 混合', D.csvRow(['日期','粥,加肉松',150]), '日期,"粥,加肉松",150');

  /* --- 日期时间读取 --- */
  var doc = w.document;
  var y = new Date(); y.setDate(y.getDate() - 1);
  var ymd = y.getFullYear() + '-' + ('0'+(y.getMonth()+1)).slice(-2) + '-' + ('0'+y.getDate()).slice(-2);
  doc.getElementById('dt').value = ymd;
  doc.getElementById('tm').value = '08:30';
  var want = new Date(y.getFullYear(), y.getMonth(), y.getDate(), 8, 30, 0, 0).getTime();
  eq('readWhen 昨天 08:30', D.readWhen(), want);

  doc.getElementById('dt').value = '2099-01-01';
  eq('readWhen 拒绝未来', D.readWhen(), -1);

  doc.getElementById('dt').value = '';
  eq('readWhen 空值', D.readWhen(), null);

  /* --- 渲染不报错 --- */
  try{
    D.setData(arr, true);
    var badge = doc.getElementById('badge').textContent;
    var info = doc.getElementById('lastInfo').textContent;
    var today = doc.getElementById('todayLine').innerHTML;
    ok('首页渲染：徽标有文字', !!badge && badge !== '无记录', badge);
    ok('首页渲染：今日汇总有导尿', today.indexOf('导尿') >= 0);
    ok('列表渲染：可点击编辑行', doc.getElementById('list').innerHTML.indexOf('data-edit=') >= 0);
    ok('底部悬浮主按钮存在', !!doc.querySelector('.dock'));
    ok('顶部按钮行已移除', !doc.querySelector('.main-row'));

    /* --- 三列布局 --- */
    var firstRow = doc.querySelector('.tr');
    ok('记录行是三列 + 说明', !!firstRow && firstRow.children.length >= 3);
    ok('第一列是时间', firstRow && firstRow.querySelector('.c1') &&
       /^\d{2}:\d{2}$/.test(firstRow.querySelector('.c1').textContent.replace('夜','').trim()));
    ok('第二列是事件', firstRow && firstRow.querySelector('.c2'));
    ok('第三列是数量', firstRow && firstRow.querySelector('.c3'));
    ok('日头可折叠（data-day）', !!doc.querySelector('.dh[data-day]'));
    ok('不再是左右双列', !doc.querySelector('.cols'));

    /* --- 筛选标签（自备数据，不依赖前面的用例）--- */
    ok('筛选标签存在', !!doc.querySelector('#segFilter'));

    var fb = new Date(); fb.setHours(12,0,0,0);
    var FT = fb.getTime(), FH = 3600000;
    D.setData([
      { id:'f1', t: FT - 6*FH, k:'c', v: 150 },
      { id:'f2', t: FT - 5*FH, k:'w', v: 100 },
      { id:'f3', t: FT - 4*FH, k:'w', v: 200, j:'s' },
      { id:'f4', t: FT - 3*FH, k:'c', v: 170 },
      { id:'f5', t: FT - 2*FH, k:'w', v: 150, j:'p' },
      { id:'f6', t: FT - 1*FH, k:'p', v: 0 }
    ], true);

    doc.querySelector('[data-f="c"]').click();
    var onlyC = doc.querySelectorAll('.tr');
    var allCath = true;
    for(var q=0;q<onlyC.length;q++){
      var evs = onlyC[q].querySelector('.c2').textContent;
      if(['导尿','排便'].indexOf(evs) < 0) allCath = false;
    }
    ok('筛选导尿后只留导尿/排便', allCath && onlyC.length === 3,
       onlyC.length + ' 行：' + Array.prototype.map.call(onlyC, function(r){
         return r.querySelector('.c2').textContent;
       }).join(','));

    doc.querySelector('[data-f="w"]').click();
    var onlyW = doc.querySelectorAll('.tr');
    var allWater = true;
    for(var q2=0;q2<onlyW.length;q2++){
      var ev2 = onlyW[q2].querySelector('.c2').textContent;
      if(['喝水','喝汤','喝粥'].indexOf(ev2) < 0) allWater = false;
    }
    ok('筛选饮水后只留水/汤/粥', allWater && onlyW.length === 3,
       onlyW.length + ' 行：' + Array.prototype.map.call(onlyW, function(r){
         return r.querySelector('.c2').textContent;
       }).join(','));
    doc.querySelector('[data-f="all"]').click();

    /* --- 折叠：日 --- */
    var tdk = D.dayKey(Date.now());
    var dh0 = doc.querySelector('.dh[data-day]');
    var wasOpen = !D.dClosedNow(tdk);
    dh0.click();
    ok('点日期后折叠状态取反', D.dClosedNow(tdk) === wasOpen);
    doc.querySelector('.dh[data-day]').click();
    ok('再点日期后状态复原', D.dClosedNow(tdk) === !wasOpen);

    /* --- 折叠：月（两层）--- */
    var tmk = D.monthKey(Date.now());
    ok('当月默认展开', D.mClosedNow(tmk) === false);
    var lastMk = Math.max.apply(null, D.getData().map(function(r){ return r.t; }));
    var mh0 = doc.querySelector('.mh[data-month]');
    ok('月头存在（data-month）', !!mh0);
    ok('月头文字是 X年X月', !!mh0 && /^\d{4}年\d{1,2}月$/.test(mh0.querySelector('.mf').textContent.replace('▼','').trim()),
       mh0 && mh0.querySelector('.mf').textContent);
    mh0.click();
    ok('点月份后折叠', D.mClosedNow(tmk) === true);
    ok('折叠后月体跟着收起（class）', doc.querySelector('.mh[data-month]').className.indexOf('closed') >= 0);
    doc.querySelector('.mh[data-month]').click();
    ok('再点月份后展开', D.mClosedNow(tmk) === false);
    ok('跨月：往月默认折叠', D.mClosedNow('2020-01') === true);
    ok('跨日：往日默认折叠', D.dClosedNow('2020-01-01') === true);

    ok('副标题给出预计时间', D.isNight(Date.now())
      ? info.indexOf('预计') < 0        /* 夜间按设计不催，不应出现「预计」 */
      : info.indexOf('预计') > 0,
      'night=' + D.isNight(Date.now()) + ' info=' + info);

    /* 弹层打开时，提示条必须避开弹层按钮 */
    D.openSheet('c');
    var toastTop = w.getComputedStyle(doc.getElementById('toast')).top;
    ok('弹层打开时提示条移到顶部', parseFloat(toastTop) >= 0, toastTop);
    D.closeSheet();
  }catch(e){
    ok('首页渲染不抛异常', false, e.message);
  }

  /* --- 阈值语义（按年龄，不再是成人 400ml） --- */
  eq('年龄 5 岁', D.ageYears(), 5);
  eq('EBC = 30×(5+1) = 180', D.ebcMl(), 180);
  var L = D.volLine();
  eq('单次量下限 60', L.low, 60);
  eq('单次量上限 180', L.high, 180);
  eq('单次量红线 216', L.hard, 216);

  eq('59ml → 偏少', D.assessVol(59).k, 'low');
  eq('60ml → 合适', D.assessVol(60).k, 'ok');
  eq('180ml → 合适（到上限不算超）', D.assessVol(180).k, 'ok');
  eq('181ml → 偏多', D.assessVol(181).k, 'more');
  eq('217ml → 超量', D.assessVol(217).k, 'over');
  eq('0ml → 不判', D.assessVol(0).k, '');

  eq('1h59m → 偏短', D.assessGap(119*60000).k, 'short');
  eq('2h → 适中', D.assessGap(2*3600000).k, 'ok');
  eq('3h30m → 适中', D.assessGap(3.5*3600000).k, 'ok');
  eq('4h01m → 偏长', D.assessGap(4.02*3600000).k, 'long');
  eq('5h01m → 过长', D.assessGap(5.02*3600000).k, 'over');
  eq('可录入上限 800', D.CFG.MAX_CATH, 800);

  /* --- 列表与今日汇总里的三档标记 --- */
  var d0 = new Date(); d0.setHours(12,0,0,0);
  var t0 = d0.getTime();
  D.setData([
    { id:'a1', t: t0 - 6*3600000, k:'c', v: 50  },
    { id:'a2', t: t0 - 3*3600000, k:'c', v: 150 },
    { id:'a3', t: t0 - 0.5*3600000, k:'c', v: 230 },
    { id:'a4', t: t0 - 0.1*3600000, k:'c', v: 120 }
  ], true);
  var lhtml = doc.getElementById('list').innerHTML;
  ok('列表：偏少标记', lhtml.indexOf('偏少') >= 0);
  ok('列表：偏短标记', lhtml.indexOf('偏短') >= 0);
  ok('列表：超量标记', lhtml.indexOf('超量') >= 0);
  ok('列表：超量行标红', lhtml.indexOf('ev-c over') >= 0, '找不到 tr 的 over 类');
  ok('今日汇总：提示超量', doc.getElementById('todayLine').innerHTML.indexOf('超量') >= 0,
     doc.getElementById('todayLine').innerHTML);

  /* --- 区间饮水：只看两次导尿之间的累计 --- */
  var b0 = new Date(); b0.setHours(12,0,0,0);
  var B = b0.getTime(), HH = 3600000;
  D.setData([
    { id:'c1', t: B - 10*HH, k:'c', v: 150 },
    { id:'w1', t: B - 9*HH,  k:'w', v: 100 },   /* 在第1��第2次导尿之间 */
    { id:'w2', t: B - 8*HH,  k:'w', v: 200, j:'s' },
    { id:'c2', t: B - 6*HH,  k:'c', v: 160 },   /* 区间内共 300 */
    { id:'w3', t: B - 5*HH,  k:'w', v: 180 },   /* 在第2、第3次之间 */
    { id:'c3', t: B - 3*HH,  k:'c', v: 140 },   /* 区间内共 180 */
    { id:'w4', t: B - 1*HH,  k:'w', v: 300 }    /* 第3次之后，不计入任何导尿行 */
  ], true);
  var lh = doc.getElementById('list').innerHTML;
  ok('导尿行显示「期间饮水」', lh.indexOf('期间饮水') >= 0);
  ok('第2次导尿区间饮水 300', lh.indexOf('期间饮水 300ml') >= 0);
  ok('第3次导尿区间饮水 180', lh.indexOf('期间饮水 180ml') >= 0);
  ok('首次导尿无区间饮水（无前一条）', (lh.match(/期间饮水/g) || []).length === 2, (lh.match(/期间饮水/g)||[]).length);

  /* --- 饮水行：当日累计 --- */
  ok('饮水行显示「当日」', lh.indexOf('当日 ') >= 0);
  ok('最后一杯当日累计 = 100+200+180+300 = 780', lh.indexOf('当日 780ml') >= 0);

  /* --- 顶部状态卡：距上次饮水 --- */
  var info2 = doc.getElementById('lastInfo').textContent;
  ok('顶部显示距上次饮水', info2.indexOf('距上次饮水') >= 0, info2);
  ok('距上次饮水不参与超时提醒', doc.getElementById('badge').textContent !== undefined);

  /* --- 原有：一键记录 + 撤销 --- */
  D.setData([], true);
  doc.getElementById('btnPoo').click();
  eq('一键记排便：+1 条', D.getData().length, 1);
  var undoBtn = doc.getElementById('toastUndo');
  ok('撤销按钮出现', undoBtn.style.display !== 'none', undoBtn.style.display);
  undoBtn.click();
  eq('撤销后回到 0 条', D.getData().length, 0);

  /* --- 回归：提示条隐藏后，撤销按钮必须一并藏回 --- */
  D.setData([], true);
  doc.getElementById('btnPoo').click();
  ok('撤销按钮先出现', doc.getElementById('toastUndo').style.display !== 'none');
  D.hideToast();
  eq('提示条隐藏后撤销按钮同步隐藏', doc.getElementById('toastUndo').style.display, 'none');
  D.toast('只有文字的提示');
  eq('后续普通提示不露出撤销', doc.getElementById('toastUndo').style.display, 'none');
  D.hideToast();
  eq('回归结束无残留记录', D.getData().length, 1);   /* 上面新增的 1 条仍在 */

  /* ===== 新增：跨夜间隔 / 饮水显示 / 简报 / 两级折叠 / 上限 ===== */

  /* --- 跨夜：22:30 → 09:00 不应被标「过长」 --- */
  var t9 = new Date(); t9.setHours(9,0,0,0);
  var pn = new Date(); pn.setDate(pn.getDate()-1); pn.setHours(22,30,0,0);
  D.setData([
    { id:'n1', t: pn.getTime(), k:'c', v:150 },
    { id:'n2', t: t9.getTime(), k:'c', v:150 }
  ], true);
  var lhn = doc.getElementById('list').innerHTML;
  ok('跨夜 10h30min 不标过长', lhn.indexOf('过长') < 0, lhn.slice(0, 260));
  ok('跨夜仍显示间隔数字', lhn.indexOf('间隔 10h30min') >= 0,
     (lhn.match(/间隔 [^<]*/) || [''])[0]);

  /* --- 白天 6h 仍正常标过长 --- */
  var t15 = new Date(); t15.setHours(15,0,0,0);
  D.setData([
    { id:'y1', t: t15.getTime() - 6*3600000, k:'c', v:150 },
    { id:'y2', t: t15.getTime(), k:'c', v:150 }
  ], true);
  ok('白天 6h 仍标过长', doc.getElementById('list').innerHTML.indexOf('过长') >= 0);

  /* --- 跨天但不在夜间时段（昨 19:00 → 今 07:45）也不判 --- */
  var t745 = new Date(); t745.setHours(7,45,0,0);
  var t19 = new Date(); t19.setDate(t19.getDate()-1); t19.setHours(19,0,0,0);
  D.setData([
    { id:'c19',  t: t19.getTime(),  k:'c', v:150 },
    { id:'c745', t: t745.getTime(), k:'c', v:150 }
  ], true);
  var lh3 = doc.getElementById('list').innerHTML;
  ok('跨天（19:00→07:45）不标过长', lh3.indexOf('过长') < 0, lh3.slice(0, 240));

  /* --- 只有饮水、没有导尿时，顶部也要显示饮水 --- */
  D.setData([{ id:'w9', t: Date.now() - 3600000, k:'w', v:100 }], true);
  var infNothing = doc.getElementById('lastInfo').textContent;
  ok('无导尿时也显示饮水', infNothing.indexOf('距上次饮水') >= 0, infNothing);
  ok('无导尿时提示先去记导尿', infNothing.indexOf('还没有导尿记录') >= 0, infNothing);

  /* --- 复诊简报 --- */
  var rNow = Date.now();
  D.setData([
    { id:'r1', t: rNow - 50*3600000, k:'c', v:230 },
    { id:'r2', t: rNow - 47*3600000, k:'c', v:150 },
    { id:'r3', t: rNow - 20*3600000, k:'w', v:200 }
  ], true);
  var rep = D.buildReport(7);
  ok('简报含「概况」', rep.html.indexOf('概况') >= 0);
  ok('简报标出超量次数', rep.html.indexOf('超量') >= 0, rep.html.slice(0, 300));
  ok('简报关键数字加粗', rep.html.indexOf('<b>') >= 0);
  ok('简报文字版可直接发微信', rep.text.indexOf('导尿：共') >= 0, rep.text.slice(0, 100));
  var s7 = D.repStats(7);
  eq('简报统计：7 天内 2 次导尿', s7.n, 2);
  eq('简报统计：1 次超量', s7.over, 1);
  ok('30 天口径不报错', D.buildReport(30).html.length > 0);
  ok('全部口径不报错', D.buildReport(0).html.length > 0);

  /* --- 跨月分组 --- */
  D.setData([
    { id:'m1', t: new Date(2026, 9, 15, 10, 0).getTime(), k:'c', v:150 },
    { id:'m2', t: new Date(2026, 10, 15, 10, 0).getTime(), k:'c', v:150 }
  ], true);
  eq('跨月 → 2 个月头', doc.querySelectorAll('.mh[data-month]').length, 2);
  ok('界面状态已落盘', !!w.localStorage.getItem('cathlog_ui_v1'),
     w.localStorage.getItem('cathlog_ui_v1'));

  /* --- 解除 800 条上限 --- */
  var many = [], mn0 = Date.now();
  for(var gi=0; gi<900; gi++){ many.push({ id:'g'+gi, t: mn0 - (900-gi)*60000, k:'c', v:150 }); }
  D.setData(many, true);
  eq('900 条全部渲染（不再截 800）', doc.querySelectorAll('.tr').length, 900);

  /* --- 分页：默认 6 个月 + 加载更早 --- */
  var mm = [];
  for(var mi=0; mi<8; mi++){
    mm.push({ id:'mm'+mi, t: new Date(2026, 2+mi, 10, 10, 0).getTime(), k:'c', v:150 });
  }
  D.setData(mm, true);
  D.UI.months = 6;
  D.renderList();
  eq('默认只渲染 6 个月', doc.querySelectorAll('.mh[data-month]').length, 6);
  ok('出现「加载更早」按钮', !!doc.getElementById('btnLoadMore'));
  doc.getElementById('btnLoadMore').click();
  eq('点击后 8 个月全出', doc.querySelectorAll('.mh[data-month]').length, 8);

  /* --- 还原真实数据 --- */
  try{
    if(savedUI === null) w.localStorage.removeItem('cathlog_ui_v1');
    else w.localStorage.setItem('cathlog_ui_v1', savedUI);
  }catch(e){}
  try{
    if(saved === null) w.localStorage.removeItem('cathlog_v1');
    else w.localStorage.setItem('cathlog_v1', saved);
  }catch(e){}
}

window.onload = function(){
  var f = document.getElementById('f');
  var go = function(){
    var out = document.getElementById('out');
    try{ run(f.contentWindow); }
    catch(e){ fails++; lines.push('FAIL 运行异常: ' + e.message); }
    var sum = (fails === 0 ? 'ALL PASS' : 'FAILURES: ' + fails) + '  (' + lines.length + ' checks)';
    document.title = (fails === 0 ? 'OK ' : 'NG ') + sum;
    out.textContent = lines.join('\n') + '\n\n==== ' + sum + ' ====';
    out.innerHTML = out.innerHTML.replace(/^(PASS.*)$/gm, '<span class="p">$1</span>')
                                 .replace(/^(FAIL.*)$/gm, '<span class="f">$1</span>');
  };
  /* iframe 已经加载完时 onload 不会再触发 */
  if(f.contentWindow && f.contentWindow.DN){ setTimeout(go, 300); }
  else { f.onload = function(){ setTimeout(go, 300); }; }
};
</script>
