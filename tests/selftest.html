<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>selftest</title>
<style>body{font:14px/1.6 monospace;padding:16px}pre{white-space:pre-wrap}.f{color:#b91c1c;font-weight:700}.p{color:#15803d}</style>
</head>
<body>
<h3>导尿记录 · 自测</h3>
<pre id="out">running…</pre>
<iframe id="f" src="../index.html" style="width:420px;height:900px;border:1px solid #ccc"></iframe>
<script>
var lines = [], fails = 0;
function ok(name, cond, extra){
  if(!cond) fails++;
  lines.push((cond ? 'PASS ' : 'FAIL ') + name + (cond || !extra ? '' : '  <' + extra + '>'));
}
function eq(name, a, b){ ok(name, a === b, JSON.stringify(a) + ' !== ' + JSON.stringify(b)); }
function near(name, a, b, tol){ ok(name, Math.abs(a - b) <= (tol || 1), a + ' vs ' + b); }

function run(w){
  var D = w.DN;
  /* 测试会触发一次 save()，结束前把真实数据放回去 */
  var saved = null;
  try{ saved = w.localStorage.getItem('cathlog_v1'); }catch(e){}
  ok('DN 已注入', !!D);
  if(!D) return;

  /* --- median --- */
  eq('median 奇数个', D.median([1,2,3]), 2);
  eq('median 偶数个', D.median([1,2,3,4]), 2.5);
  eq('median 空数组', D.median([]), 0);

  /* --- 时间工具 --- */
  eq('fmtGap 3h28min', D.fmtGap(3*3600000 + 28*60000), '3h28min');
  eq('fmtGap 整点', D.fmtGap(2*3600000), '2h');
  eq('dayKey', D.dayKey(new Date(2026,9,17,13,5).getTime()), '2026-10-17');
  eq('dateValue', D.dateValue(new Date(2026,0,5,0,0).getTime()), '2026-01-05');
  eq('hm', D.hm(new Date(2026,0,5,9,7).getTime()), '09:07');

  /* --- 个人基线 --- */
  var now = Date.now();
  function mk(i, hoursAgo, ml){ return { id:'t'+i, t: now - hoursAgo*3600000, k:'c', v: ml }; }
  /* 7 条导尿，间隔 3 小时，量 150 */
  var arr = [];
  for(var i=0;i<7;i++) arr.push(mk(i, i*3, 150));
  D.setData(arr, true);
  var b = D.computeBaseline();
  ok('基线：样本够 → gapOK', b.gapOK);
  near('基线：中位间隔约 3h', b.gapMs, 3*3600000, 60000);
  eq('基线：中位量 150', b.volMed, 150);

  /* 只有 2 条 → 退回默认 3h */
  D.setData([mk(0,0,150), mk(1,3,150)], true);
  var b2 = D.computeBaseline();
  ok('基线：样本不足 → gapOK=false', !b2.gapOK);
  eq('基线：样本不足退回 3h', b2.gapMs, 3*3600000);

  /* 一个 20 小时的跨夜中断应被排除 */
  var arr3 = [mk(0,0,150), mk(1,3,150), mk(2,6,150), mk(3,9,150), mk(4,12,150), mk(5,15,150), mk(6,35,150)];
  D.setData(arr3, true);
  var b3 = D.computeBaseline();
  ok('基线：排除 >12h 的中断', b3.gapOK && Math.abs(b3.gapMs - 3*3600000) < 60000, b3.gapMs);

  /* --- 备份往返 --- */
  D.setData([mk(0,0,180), {id:'w1', t: now - 3600000, k:'w', v:100, j:'s'},
             {id:'p1', t: now - 7200000, k:'p', v:0}], true);
  var txt = D.buildBackup();
  var back = D.parseBackup(txt);
  ok('备份往返：条数一致', back && back.length === 3, back && back.length);
  var byK = {};
  (back || []).forEach(function(r){ byK[r.k] = r; });
  eq('备份往返：汤类型保留', byK.w && byK.w.j, 's');
  eq('备份往返：排便量 0', byK.p && byK.p.v, 0);
  eq('备份往返：导尿量 180', byK.c && byK.c.v, 180);
  ok('备份可被 JSON.parse', !!JSON.parse(txt).records);

  /* --- 备份容错 --- */
  eq('非 JSON 拒绝', D.parseBackup('hello'), null);
  eq('缺 records 拒绝', D.parseBackup('{"a":1}'), null);
  eq('脏记录被过滤', (D.parseBackup('[{"t":1,"k":"x"},{"t":2,"k":"c","v":100}]') || []).length, 1);
  ok('裸数组可导入', (D.parseBackup('[{"t":1700000000000,"k":"c","v":120}]') || []).length === 1);

  /* --- CSV --- */
  var csv = D.buildCsv();
  ok('CSV 有 BOM', csv.charCodeAt(0) === 0xFEFF);
  eq('CSV 表头', csv.split('\r\n')[0], '\ufeff日期,时间,事件,量(ml),距上次同类型');
  eq('CSV 行数 = 记录数+表头', csv.trim().split('\r\n').length, 4);

  /* --- CSV 转义（RFC 4180） --- */
  eq('csvCell 普通', D.csvCell('导尿'), '导尿');
  eq('csvCell 数字', D.csvCell(150), '150');
  eq('csvCell 空值', D.csvCell(null), '');
  eq('csvCell 含逗号', D.csvCell('粥,加肉松'), '"粥,加肉松"');
  eq('csvCell 含双引号', D.csvCell('他说"好"'), '"他说""好"""');
  eq('csvCell 含换行', D.csvCell('a\nb'), '"a\nb"');
  eq('csvRow 混合', D.csvRow(['日期','粥,加肉松',150]), '日期,"粥,加肉松",150');

  /* --- 日期时间读取 --- */
  var doc = w.document;
  var y = new Date(); y.setDate(y.getDate() - 1);
  var ymd = y.getFullYear() + '-' + ('0'+(y.getMonth()+1)).slice(-2) + '-' + ('0'+y.getDate()).slice(-2);
  doc.getElementById('dt').value = ymd;
  doc.getElementById('tm').value = '08:30';
  var want = new Date(y.getFullYear(), y.getMonth(), y.getDate(), 8, 30, 0, 0).getTime();
  eq('readWhen 昨天 08:30', D.readWhen(), want);

  doc.getElementById('dt').value = '2099-01-01';
  eq('readWhen 拒绝未来', D.readWhen(), -1);

  doc.getElementById('dt').value = '';
  eq('readWhen 空值', D.readWhen(), null);

  /* --- 渲染不报错 --- */
  try{
    D.setData(arr, true);
    var badge = doc.getElementById('badge').textContent;
    var info = doc.getElementById('lastInfo').textContent;
    var today = doc.getElementById('todayLine').innerHTML;
    ok('首页渲染：徽标有文字', !!badge && badge !== '无记录', badge);
    ok('首页渲染：今日汇总有导尿', today.indexOf('导尿') >= 0);
    ok('列表渲染：可点击编辑行', doc.getElementById('list').innerHTML.indexOf('data-edit=') >= 0);
    ok('底部悬浮主按钮存在', !!doc.querySelector('.dock'));
    ok('顶部按钮行已移除', !doc.querySelector('.main-row'));
    ok('副标题给出预计时间', D.isNight(Date.now())
      ? info.indexOf('预计') < 0        /* 夜间按设计不催，不应出现「预计」 */
      : info.indexOf('预计') > 0,
      'night=' + D.isNight(Date.now()) + ' info=' + info);

    /* 弹层打开时，提示条必须避开弹层按钮 */
    D.openSheet('c');
    var toastTop = w.getComputedStyle(doc.getElementById('toast')).top;
    ok('弹层打开时提示条移到顶部', parseFloat(toastTop) >= 0, toastTop);
    D.closeSheet();
  }catch(e){
    ok('首页渲染不抛异常', false, e.message);
  }

  /* --- 阈值语义（按年龄，不再是成人 400ml） --- */
  eq('年龄 5 岁', D.ageYears(), 5);
  eq('EBC = 30×(5+1) = 180', D.ebcMl(), 180);
  var L = D.volLine();
  eq('单次量下限 60', L.low, 60);
  eq('单次量上限 180', L.high, 180);
  eq('单次量红线 216', L.hard, 216);

  eq('59ml → 偏少', D.assessVol(59).k, 'low');
  eq('60ml → 合适', D.assessVol(60).k, 'ok');
  eq('180ml → 合适（到上限不算超）', D.assessVol(180).k, 'ok');
  eq('181ml → 偏多', D.assessVol(181).k, 'more');
  eq('217ml → 超量', D.assessVol(217).k, 'over');
  eq('0ml → 不判', D.assessVol(0).k, '');

  eq('1h59m → 偏短', D.assessGap(119*60000).k, 'short');
  eq('2h → 适中', D.assessGap(2*3600000).k, 'ok');
  eq('3h30m → 适中', D.assessGap(3.5*3600000).k, 'ok');
  eq('4h01m → 偏长', D.assessGap(4.02*3600000).k, 'long');
  eq('5h01m → 过长', D.assessGap(5.02*3600000).k, 'over');
  eq('可录入上限 800', D.CFG.MAX_CATH, 800);

  /* --- 列表与今日汇总里的三档标记 --- */
  var d0 = new Date(); d0.setHours(12,0,0,0);
  var t0 = d0.getTime();
  D.setData([
    { id:'a1', t: t0 - 6*3600000, k:'c', v: 50  },
    { id:'a2', t: t0 - 3*3600000, k:'c', v: 150 },
    { id:'a3', t: t0 - 0.5*3600000, k:'c', v: 230 },
    { id:'a4', t: t0 - 0.1*3600000, k:'c', v: 120 }
  ], true);
  var lhtml = doc.getElementById('list').innerHTML;
  ok('列表：偏少标记', lhtml.indexOf('偏少') >= 0);
  ok('列表：偏短标记', lhtml.indexOf('偏短') >= 0);
  ok('列表：超量标记', lhtml.indexOf('超量') >= 0);
  ok('列表：超量行标红', lhtml.indexOf('rec2 over') >= 0);
  ok('今日汇总：提示超量', doc.getElementById('todayLine').innerHTML.indexOf('超量') >= 0,
     doc.getElementById('todayLine').innerHTML);

  /* --- 一键记录 + 撤销（端到端） --- */
  D.setData([], true);
  doc.getElementById('btnPoo').click();
  eq('一键记排便：+1 条', D.getData().length, 1);
  var undoBtn = doc.getElementById('toastUndo');
  ok('撤销按钮出现', undoBtn.style.display !== 'none', undoBtn.style.display);
  undoBtn.click();
  eq('撤销后回到 0 条', D.getData().length, 0);

  /* --- 回归：提示条隐藏后，撤销按钮必须一并藏回 --- */
  D.setData([], true);
  doc.getElementById('btnPoo').click();
  ok('撤销按钮先出现', doc.getElementById('toastUndo').style.display !== 'none');
  D.hideToast();
  eq('提示条隐藏后撤销按钮同步隐藏', doc.getElementById('toastUndo').style.display, 'none');
  D.toast('只有文字的提示');
  eq('后续普通提示不露出撤销', doc.getElementById('toastUndo').style.display, 'none');
  D.hideToast();
  eq('回归结束无残留记录', D.getData().length, 1);   /* 上面新增的 1 条仍在 */

  /* 还原真实数据 */
  try{
    if(saved === null) w.localStorage.removeItem('cathlog_v1');
    else w.localStorage.setItem('cathlog_v1', saved);
  }catch(e){}
}

window.onload = function(){
  var f = document.getElementById('f');
  var go = function(){
    var out = document.getElementById('out');
    try{ run(f.contentWindow); }
    catch(e){ fails++; lines.push('FAIL 运行异常: ' + e.message); }
    var sum = (fails === 0 ? 'ALL PASS' : 'FAILURES: ' + fails) + '  (' + lines.length + ' checks)';
    document.title = (fails === 0 ? 'OK ' : 'NG ') + sum;
    out.textContent = lines.join('\n') + '\n\n==== ' + sum + ' ====';
    out.innerHTML = out.innerHTML.replace(/^(PASS.*)$/gm, '<span class="p">$1</span>')
                                 .replace(/^(FAIL.*)$/gm, '<span class="f">$1</span>');
  };
  /* iframe 已经加载完时 onload 不会再触发 */
  if(f.contentWindow && f.contentWindow.DN){ setTimeout(go, 300); }
  else { f.onload = function(){ setTimeout(go, 300); }; }
};
</script>
</body>
</html>
